  const code = Math.random().toString(36).slice(2, 8).toUpperCase();
  const body = {
    404: `<p class="big grad" aria-hidden="true">404</p><h1 id="sp-h" tabindex="-1">This page has drifted off the map</h1>
      <p>The link may be broken or the page may have moved. Your account and balances are safe.</p>
      <div class="actions"><button class="btn on-dark" data-sp="back">Go back</button><button class="btn primary" data-sp="home">Go to home</button></div>`,
    maint: `<div style="color:#8FE3F5;margin:0 auto 16px;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:rgba(143,227,245,.1);border:1px solid rgba(143,227,245,.2)">${icSize('wrench', 30)}</div>
      <h1 id="sp-h" tabindex="-1">We’re upgrading Grat</h1>
      <p>Planned maintenance is under way. Your money is safe and nothing is lost. We expect to be back in about 20 minutes.</p>
      <div class="maint-list"><div><span class="st-dot ok"></span>Your balances<span>Safe</span></div><div><span class="st-dot slow"></span>Trading and sends<span>Paused</span></div><div><span class="st-dot ok"></span>Deposits already made<span>Will be credited</span></div></div>
      <div class="actions"><button class="btn primary" data-sp="retry">Check again</button></div>`,
    fatal: `<div style="color:#FF8A82;margin:0 auto 16px;width:68px;height:68px;border-radius:22px;display:grid;place-items:center;background:rgba(255,122,112,.1);border:1px solid rgba(255,122,112,.2)">${icSize('alertTri', 30)}</div>
      <h1 id="sp-h" tabindex="-1">Something went wrong</h1>
      <p>An unexpected error stopped this page. Nothing has been sent or charged. Reloading usually fixes it.</p>
      <p class="mono" style="font-size:12px;color:#6F7F99;margin-top:-10px">Error reference GR-${code}</p>
      <div class="actions"><button class="btn on-dark" data-sp="home">Go to home</button><button class="btn primary" data-sp="reload">Reload</button></div>`
  }[kind];
  sp.innerHTML = `<div class="aurora" aria-hidden="true"></div><div class="grid-floor" aria-hidden="true"></div><div role="main" aria-labelledby="sp-h" style="position:relative;max-width:620px">${body}</div>`;
  sp.dataset.kind = kind; sp.hidden = false;
  sp._prev = setInertAll(sp);
  document.title = {404:'Page not found', maint:'Maintenance', fatal:'Something went wrong'}[kind] + ' · Grat';
  $('#sp-h').focus();
}
function hideSpecial(){ const sp = $('#special'); if (sp.hidden) return; restoreInert(sp._prev); sp.hidden = true; }
function show404(){ showSpecial('404'); }
$('#special').addEventListener('click', e => {
  const b = e.target.closest('[data-sp]'); if (!b) return;
  const k = b.dataset.sp;
  if (k === 'reload'){ location.hash = ''; location.reload(); return; }
  if (k === 'retry'){ b.disabled = true; b.innerHTML = '<span class="dot-spin" aria-hidden="true"></span> Checking…'; setTimeout(() => { state.demo.maint = false; hideSpecial(); goHome(); toast('Grat is back. Thanks for waiting.'); }, 1200); return; }
  hideSpecial();
  if (k === 'back' && history.length > 1){ history.back(); return; }
  goHome();
});
function goHome(){ if (state.signedIn){ showScreen('app'); setView('home'); } else showLanding(); }
window.addEventListener('error', e => { if (String(e.message).includes('ResizeObserver')) return; showSpecial('fatal'); });

/* ================= Guided tour ================= */
const TOUR = [
  {sel:() => '#hero-total', t:'Your money at a glance', d:'Your total across every account, in the currency you choose. Drag across the chart to see any day.'},
  {sel:() => '.quick', t:'Everyday actions', d:'Transfer, pay, exchange, deposit a check or add money, right from Home.'},
  {sel:() => isMobile() ? '.nav-trade' : '#trade-side', t:'Move money from anywhere', d:'This opens every way to move money, including sending abroad and paying bills.'},
  {sel:() => isMobile() ? '.nav-more' : '[data-act="go:cards"]', t:'Cards under your control', d:'Freeze a card, change limits or create a virtual card in seconds.'},
  {sel:() => '#theme-btn', t:'Light or dark', d:'Switch themes any time. Text size, contrast and language are in Settings.'},
  {sel:() => '#demo-fab', t:'Try every state', d:'Demo controls let you preview loading, empty, offline and error screens.'}
];
let tourEnd = null;
function endTour(){ tourEnd && tourEnd(); }
function trapTab(e, box){
  if (e.key !== 'Tab') return;
  const f = $$(FOCUSABLE, box).filter(el => el.offsetParent !== null); if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
}
function startTour(){
  if (!state.signedIn) return;
  closeModal(); closePop(); endTour();
  if (state.route.view !== 'home' || state.loading) setView('home', null, {instant:true});
  let i = 0;
  const prevFocus = document.activeElement;
  const spot = document.createElement('div'); spot.className = 'tour-spot';
  const card = document.createElement('div'); card.className = 'tour-card';
  card.setAttribute('role', 'dialog'); card.setAttribute('aria-modal', 'true'); card.setAttribute('aria-labelledby', 'tour-h'); card.setAttribute('aria-describedby', 'tour-d');
  document.body.append(spot, card);
  const prev = setInertAll(card);
  const target = () => $(TOUR[i].sel());
  const place = () => {
    const el = target(); if (!el) return;
    const r = el.getBoundingClientRect(), pad = 8;
    Object.assign(spot.style, {top: r.top - pad + 'px', left: r.left - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px'});
    const cw = card.offsetWidth, ch = card.offsetHeight;
    let top = r.bottom + pad + 12;
    if (top + ch > innerHeight - 12) top = r.top - pad - 12 - ch;
    if (top < 12) top = Math.min(innerHeight - ch - 12, Math.max(12, r.top + 20));
    card.style.top = top + 'px';
    card.style.left = clamp(r.left + r.width / 2 - cw / 2, 12, innerWidth - cw - 12) + 'px';
  };
  const draw = () => {
    const st = TOUR[i], last = i === TOUR.length - 1;
    card.innerHTML = `<h2 id="tour-h">${st.t}</h2><p id="tour-d">${st.d}</p>
      <div class="actions" style="align-items:center;margin:0"><div class="tour-dots" aria-hidden="true">${TOUR.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div><span class="sr-only">Step ${i + 1} of ${TOUR.length}</span>
      ${last ? '' : '<button class="btn small" data-t="skip">Skip</button>'}${i > 0 ? '<button class="btn small" data-t="back">Back</button>' : ''}<button class="btn small primary" data-t="next">${last ? 'Finish' : 'Next'}</button></div>`;
    const el = target(); el && el.scrollIntoView({block:'center'});
    requestAnimationFrame(() => { place(); $('[data-t=next]', card).focus(); });
  };
  const onKey = e => { if (e.key === 'Escape') tourEnd(); trapTab(e, card); };
  tourEnd = () => {
    spot.remove(); card.remove(); restoreInert(prev);
    removeEventListener('resize', place); removeEventListener('scroll', place, true);
    tourEnd = null; state.seenTour = true;
    (prevFocus && document.contains(prevFocus) ? prevFocus : $('#page-title'))?.focus({preventScroll:true});
  };
  card.addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    if (b.dataset.t === 'next'){ if (i === TOUR.length - 1){ tourEnd(); toast('You’re all set. Enjoy Grat!'); } else { i++; draw(); } }
    else if (b.dataset.t === 'back'){ i--; draw(); }
    else tourEnd();
  });
  card.addEventListener('keydown', onKey);
  addEventListener('resize', place); addEventListener('scroll', place, true);
  draw();
}

/* ================= App lock & session timeout ================= */
const IDLE_WARN_MS = 4 * 60e3;
let lockEl = null, lastActive = Date.now(), warnOpen = false;
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => { if (!warnOpen) lastActive = Date.now(); }, {passive:true, capture:true}));
setInterval(() => { if (state.signedIn && !lockEl && !warnOpen && !$('#app').hidden && Date.now() - lastActive > IDLE_WARN_MS) openSessionWarning(); }, 5000);
function openSessionWarning(){
  if (!state.signedIn || lockEl) return;
  endTour(); warnOpen = true; let n = 30;
  openModal({title:'Are you still there?', render(m){
    m.body.innerHTML = `<div class="done"><div class="ok-ring pend">${I.clock}</div><p style="margin:0 0 14px">For your security, Grat will lock in <b id="sw-n">30</b> seconds.</p></div>
      <div class="meter" style="margin-bottom:18px" aria-hidden="true"><i id="sw-bar" style="width:100%"></i></div>
      <div class="actions split"><button class="btn" id="sw-lock">Lock now</button><button class="btn primary" data-close data-autofocus>Stay signed in</button></div>`;
    $('#sw-lock').onclick = () => { closeModal(); showLock(); };
    m.every(() => { n--; const el = $('#sw-n'); if (el){ el.textContent = n; $('#sw-bar').style.width = n / 30 * 100 + '%'; } if (n === 10) $('#live').textContent = 'Grat locks in 10 seconds'; if (n <= 0){ closeModal(); showLock(); } }, 1000);
  }, onClose(){ warnOpen = false; lastActive = Date.now(); }});
}
function showLock(){
  if (lockEl || !state.signedIn) return;
  closeModal(); closePop(); endTour();
  const ini = (state.profile.first[0] + state.profile.last[0]).toUpperCase();
  lockEl = document.createElement('div');
  lockEl.className = 'lock space force-dark';
  lockEl.setAttribute('role', 'dialog'); lockEl.setAttribute('aria-modal', 'true'); lockEl.setAttribute('aria-labelledby', 'lock-h');
  lockEl.innerHTML = `<div class="aurora" aria-hidden="true"></div><div class="lock-card">
    <div class="lock-av" aria-hidden="true">${userAvatar(72)}</div><h2 id="lock-h">Welcome back, ${esc(state.profile.first)}</h2><p class="sub" id="lock-sub" style="margin:0">Grat is locked. Enter your PIN to continue.</p>
    <div class="pin-dots" id="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="sr-only" id="pin-sr" aria-live="polite"></p><p class="err" id="pin-err" role="alert" style="min-height:20px;color:#FF8A82;margin:0"></p>
    <div class="keypad" role="group" aria-label="PIN keypad">${[1,2,3,4,5,6,7,8,9].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}
      <button class="key txt" data-k="face" aria-label="Unlock with Face ID">${I.faceid}</button><button class="key" data-k="0">0</button><button class="key txt" data-k="del" aria-label="Delete last digit">⌫</button></div>
    <p class="hint" style="color:#8C9BB3;margin:0 0 8px">Prototype PIN: 1234. You can also type it.</p>
    <button class="link" data-k="out" style="color:#A9B8CE">Sign out instead</button></div>`;
  document.body.appendChild(lockEl);
  lockEl._prev = setInertAll(lockEl);
  let pin = '', tries = 5;
  const q = s => $(s, lockEl);
  const upd = () => { $$('#pin-dots i', lockEl).forEach((d, j) => d.classList.toggle('on', j < pin.length)); q('#pin-sr').textContent = `${pin.length} of 4 digits entered`; };
  const press = k => {
    if (k === 'del'){ pin = pin.slice(0, -1); upd(); return; }
    if (k === 'out'){ signOut(); return; }
    if (k === 'face'){ q('#pin-err').textContent = ''; q('#lock-sub').textContent = 'Looking for your face…'; setTimeout(unlock, 900); return; }
    if (pin.length >= 4) return;
    pin += k; upd();
    if (pin.length < 4) return;
    if (pin === '1234'){ setTimeout(unlock, 200); return; }
    tries--;
    const d = q('#pin-dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
    q('#pin-err').textContent = tries > 0 ? `Wrong PIN. ${tries} ${tries === 1 ? 'try' : 'tries'} left.` : 'Too many tries. Please sign in again.';
    setTimeout(() => { pin = ''; upd(); }, 350);
    if (tries <= 0) setTimeout(signOut, 1400);
  };
  lockEl.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(b.dataset.k); });
  lockEl.addEventListener('keydown', e => {
    if (/^\d$/.test(e.key)){ e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace'){ e.preventDefault(); press('del'); }
    trapTab(e, lockEl);
  });
  q('[data-k="1"]').focus();
}
function unlockCleanup(){ if (!lockEl) return; restoreInert(lockEl._prev); lockEl.remove(); lockEl = null; lastActive = Date.now(); }
function unlock(){ unlockCleanup(); toast('Unlocked'); $('#page-title')?.focus({preventScroll:true}); }

/* ================= Demo controls ================= */
let demoBackup = null;
const DEMO_KEYS = ['accounts','cards','txns','payees','scheduled','bills','goals','budgets','referrals','disputes','travel'];
function demoEmpty(){ demoBackup = JSON.stringify(Object.fromEntries(DEMO_KEYS.map(k => [k, state[k]]))); resetToEmpty(); }
function demoRestore(){ Object.assign(state, JSON.parse(demoBackup)); demoBackup = null; state.cardSel = null; state.stAcct = null; }
function openDemo(){
  const inApp = state.signedIn;
  openModal({title:'Demo controls', render(m){
    const sw = (k, label, sub) => `<div class="demo-sw"><label for="dm-${k}" style="cursor:pointer"><div class="nm" style="font-weight:500">${label}</div><div class="sub">${sub}</div></label><input type="checkbox" role="switch" class="switch" id="dm-${k}" data-dsw="${k}" ${state.demo[k] ? 'checked' : ''}></div>`;
    const btn = (k, label, needApp = false) => `<button class="btn small" data-dm="${k}" ${needApp && !inApp ? 'disabled' : ''}>${label}</button>`;
    m.body.innerHTML = `<p class="hint" style="margin-bottom:16px">Preview every state of the product. ${inApp ? '' : 'Sign in to try the in-app options.'}</p>
      <div class="demo-grp"><h3>Screens</h3><div class="demo-grid">${btn('splash', 'Splash screen')}${btn('landing', 'Landing page')}${btn('reload', 'Loading skeletons', true)}${btn(demoBackup ? 'restore' : 'empty', demoBackup ? 'Restore demo data' : 'New, empty account', true)}${btn('404', '404 page')}${btn('maint', 'Maintenance page')}</div>
        ${sw('slow', 'Slow connection', 'Loading takes longer so you can study skeletons.')}</div>
      <div class="demo-grp"><h3>Errors</h3>
        ${sw('offline', 'Go offline', 'Shows the offline banner and pauses payments.')}
        ${sw('feedDown', 'Exchange rates down', 'Exchange error state, international transfers paused.')}
        ${sw('failPay', 'Fail the next payment', 'The next transfer, payment or bill shows a failure screen.')}
        ${sw('declineCard', 'Decline the next card top-up', 'Also try card 4000 0000 0000 0002.')}
        <div class="demo-grid" style="margin-top:8px">${btn('crash', 'Crash the app')}${btn('wrongpin', 'Wrong password error')}${btn('nofunds', 'Not enough money', true)}${btn('loandecline', 'Loan declined', true)}</div></div>
      <div class="demo-grp"><h3>Security</h3><div class="demo-grid">${btn('lock', 'Lock app now', true)}${btn('timeout', 'Session timeout warning', true)}${btn('acctlock', 'Lock the account', true)}${btn('namecheck', 'Payee name mismatch', true)}</div></div>
      <div class="demo-grp" style="margin:0"><h3>Guides</h3><div class="demo-grid">${btn('tour', 'Start the tour', true)}${btn('cookie', 'Cookie banner')}${btn('theme', 'Light or dark mode')}${btn('lang', 'Try German')}</div></div>`;
    m.body.addEventListener('change', e => {
      const k = e.target.dataset.dsw; if (!k) return;
      state.demo[k] = e.target.checked; const on = e.target.checked;
      if (k === 'offline'){ toast(on ? 'You’re offline (simulated)' : 'Back online'); if (inApp) render(); }
      else if (k === 'feedDown'){ toast(on ? 'Exchange rates are down (simulated)' : 'Live exchange rates are back'); if (inApp) render(); }
      else toast(on ? 'Turned on' : 'Turned off');
    });
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-dm]'); if (!b) return;
      const k = b.dataset.dm; closeModal();
      ({
        splash(){ const s = $('#splash'); const c = s.cloneNode(true); c.classList.remove('out'); c.hidden = false; s.replaceWith(c); setTimeout(() => { c.classList.add('out'); setTimeout(() => { c.hidden = true; }, 600); }, 1700); },
        landing(){ showLanding(); },
        reload(){ setView(state.route.view, state.route.arg); },
        empty(){ demoEmpty(); setView('home'); toast('Showing a new, empty account'); },
        restore(){ demoRestore(); setView('home'); toast('Demo data restored'); },
        404(){ setHash('#/this-page-does-not-exist'); show404(); },
        maint(){ state.demo.maint = true; showSpecial('maint'); },
        crash(){ setTimeout(() => { throw new Error('Simulated crash'); }); },
        wrongpin(){ if (state.signedIn) signOut(); else showLogin('signin'); setTimeout(() => { $('#lp').value = 'wrong'; $('#lp').focus(); toast('Press Continue to see the error'); }, 50); },
        nofunds(){ openTransfer({from: ACC('eur') ? 'eur' : 'chk', val:'99999'}); setTimeout(() => $('#tf')?.requestSubmit(), 60); },
        loandecline(){ openLoanApply(); toast('Enter an income under 20,000 to see the decline'); },
        lock: showLock, timeout: openSessionWarning,
        acctlock(){ state.locked = true; render(); toast('Account locked. Try making a payment.'); },
        namecheck(){ openPayeeAdd({prefill:'Test Unknown'}); },
        tour: startTour, cookie(){ state.cookie = null; if (state.signedIn){ toast('Showing the banner from the landing page'); showLanding(); } else showCookieBanner(); },
        theme(){ act('theme'); }, lang(){ state.lang = state.lang === 'de' ? 'en' : 'de'; applyPrefs(); rerenderAll(); toast(state.lang === 'de' ? 'Sprache: Deutsch' : 'Language: English'); }
      })[k]();
    });
  }});
}
function rerenderAll(){
  if (!$('#landing').hidden) renderLanding();
  if (!$('#app').hidden) render();
  if (!$('#login').hidden) renderLogin('signin');
}

/* ================= Router extensions ================= */
const baseAct = act;
act = function(s){
  const i = s.indexOf(':'), k = i < 0 ? s : s.slice(0, i), v = i < 0 ? null : s.slice(i + 1);
  switch (k){
    case 'landing': showLanding(); return;
    case 'login': state.signedIn ? showApp('home') : showLogin('signin'); return;
    case 'signup': state.signedIn ? showApp('home') : showLogin('signup'); return;
    case 'go': case 'account': if (!state.signedIn){ state.afterLogin = k === 'go' ? {view:v} : {view:'account', arg:v}; showLogin('signin'); return; } break;
    case 'theme': state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyPrefs(); if (state.route.view === 'settings' && !$('#app').hidden) render(); toast(state.theme === 'dark' ? 'Dark mode on' : 'Light mode on'); return;
    case 'demo': openDemo(); return;
    case 'tour': startTour(); return;
    case 'cookies': openCookieManage(); return;
    case 'forgot': openForgot(); return;
    case 'retry-net': retryNet(); return;
    case 'retry-feed': retryFeed(); return;
    case 'invite-copy': (navigator.clipboard ? navigator.clipboard.writeText(INVITE_LINK) : Promise.reject()).then(() => toast('Invite link copied'), () => toast(INVITE_LINK)); return;
    case 'invite-share': navigator.share ? navigator.share({title:'Join me at Grat', url:INVITE_LINK}).catch(() => {}) : act('invite-copy'); return;
    case 'invite-resend': toast('Invite sent again'); return;
    case 'status-modal': openStatusModal(); return;
  }
  baseAct(s);
};
document.addEventListener('change', e => {
  const s = e.target.dataset && e.target.dataset.set; if (!s) return;
  if (s === 'theme'){ state.theme = e.target.value; applyPrefs(); }
  else if (s === 'size'){ state.size = e.target.value; applyPrefs(); toast('Text size updated'); }
  else if (s === 'contrast'){ state.contrast = e.target.checked; applyPrefs(); toast(state.contrast ? 'High contrast on' : 'High contrast off'); }
  else if (s === 'motion'){ state.motion = e.target.checked; applyPrefs(); toast(state.motion ? 'Animations reduced' : 'Animations on'); }
  else if (s === 'lang'){ const id = e.target.id; state.lang = e.target.value; applyPrefs(); rerenderAll(); $('#' + id)?.focus(); toast(LANGS.find(l => l[0] === state.lang)[1]); }
});

/* ================= Live update and view hook extensions ================= */
const baseHomeAfter = AFTER.home;
AFTER.home = () => {
  baseHomeAfter();
  if (state.countUp && !state.hidden && !reducedMotion()){
    const el = $('#hero-total'), to = totalCash(), from = to * .94, t0 = performance.now();
    const step = t => { if (!document.contains(el) || scrubbing) return; const k = Math.min(1, (t - t0) / 850), e = 1 - Math.pow(1 - k, 3); el.innerHTML = heroNum(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  state.countUp = false;
};

/* ================= Boot ================= */
applyPrefs();
hydrateIcons();
updateLive();
setInterval(tick, TICK_MS);
handleRoute();
setTimeout(() => { const s = $('#splash'); s.classList.add('out'); setTimeout(() => { s.hidden = true; }, 600); }, 1500);

</script>
