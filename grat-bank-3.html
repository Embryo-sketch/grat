<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grat · Online Banking</title>
<meta name="description" content="Grat online banking: checking, savings and accounts in six currencies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:where(:root){
  --ice:#EEF2F7; --paper:#FFFFFF; --field:#FFFFFF; --ink:#162033; --muted:#5B6879; --line:#D9E1EB; --line-2:#C6D1DE; --hover:#E2E8F0;
  --cobalt:#2B47F5; --cobalt-ink:#1C33C9; --cobalt-soft:#EEF1FF; --link:#2B47F5; --glacier:#CDEAF2; --glacier-2:#8FCBDB;
  --credit:#11805A; --credit-soft:#E3F4EC; --alert:#C9302A; --alert-soft:#FBEDEC; --amber:#9A6B00; --amber-soft:#FFF4DC; --amber-ink:#5E4300;
  --inv-bg:#162033; --inv-fg:#FFFFFF; --shadow:rgba(22,32,51,.18); --overlay:rgba(22,32,51,.44); --skel:#E3E9F1; --skel-hi:#F6F8FB;
  --nav-bg:rgba(238,242,247,.94); --switch-off:#C3CDDA; --ring:rgba(43,71,245,.25);
  --r-lg:22px; --r-md:14px; --r-sm:10px; color-scheme:light;
}
:where(html[data-theme="dark"]), :where(.force-dark){
  --ice:#0A101C; --paper:#111A2B; --field:#0C1422; --ink:#E7EDF6; --muted:#97A5BA; --line:#1E2A3F; --line-2:#2D3C56; --hover:#172136;
  --cobalt:#4D68FF; --cobalt-ink:#AEBDFF; --cobalt-soft:#18214A; --link:#93A6FF; --glacier:#15324A; --glacier-2:#5FB6CF;
  --credit:#3DD39A; --credit-soft:#0E2E23; --alert:#FF7A70; --alert-soft:#3A1917; --amber:#F0C35A; --amber-soft:#30260E; --amber-ink:#F3D58C;
  --inv-bg:#E7EDF6; --inv-fg:#0A101C; --shadow:rgba(0,0,0,.5); --overlay:rgba(3,6,12,.68); --skel:#172236; --skel-hi:#22314A;
  --nav-bg:rgba(10,16,28,.92); --switch-off:#34445F; --ring:rgba(93,120,255,.35); color-scheme:dark;
}
:where(html[data-contrast="high"]){--muted:#3A4557;--line:#A6B3C4;--line-2:#7D8CA1}
:where(html[data-theme="dark"][data-contrast="high"]){--muted:#CBD5E3;--line:#46587C;--line-2:#6C80A6}
html[data-motion="reduce"] *,html[data-motion="reduce"] *::before,html[data-motion="reduce"] *::after{animation:none!important;transition:none!important}
html[data-size="small"]{--zoom:.92} html[data-size="large"]{--zoom:1.12}
#main,.landing,.login-card{zoom:var(--zoom,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;transition:background .25s;font-family:Geist,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--ice);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;overflow-wrap:anywhere}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg{flex:none}
[hidden]{display:none!important}
h1,h2,h3{letter-spacing:-.01em}

/* ---------- Strength ---------- */
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:2px}
.strength i{height:4px;border-radius:2px;background:var(--line)}
.strength.s1 i:nth-child(-n+1){background:var(--alert)}
.strength.s2 i:nth-child(-n+2){background:#D08A1E}
.strength.s3 i:nth-child(-n+3){background:var(--credit)}
.strength.s4 i{background:var(--credit)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);overflow:auto}
.side .brand{padding:4px 10px 18px}
.trade-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 2px 14px;padding:11px 14px;border-radius:999px;border:0;background:var(--cobalt);color:#fff;font-weight:600}
.trade-btn:hover{background:var(--cobalt-ink)}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;background:none;border-radius:11px;color:var(--muted);font-weight:500;text-align:left}
.nav-btn:hover{background:var(--hover);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav-btn[aria-current="page"] svg{color:var(--link)}
.nav-sep{height:1px;background:var(--line);margin:10px 12px}
.nav-more,.nav-trade{display:none}
.side-foot{margin-top:auto;padding-top:12px;display:grid;gap:4px}
.side-status{text-align:left;width:100%;font:inherit;cursor:pointer;padding:12px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);font-size:13px;color:var(--muted);margin-bottom:6px}
.side-status strong{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600;margin-bottom:2px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--credit);box-shadow:0 0 0 0 rgba(17,128,90,.5);animation:livepulse 2s infinite}
@keyframes livepulse{70%{box-shadow:0 0 0 7px rgba(17,128,90,0)}100%{box-shadow:0 0 0 0 rgba(17,128,90,0)}}

#main{padding:20px 36px 64px;max-width:1240px;width:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.top h1{font-size:22px;font-weight:600;margin:0;flex:1;outline:none}
.search-btn{display:flex;align-items:center;gap:10px;min-width:250px;padding:9px 12px 9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted)}
.search-btn .lbl{flex:1;text-align:left}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--ice)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);border-radius:999px;position:relative;color:var(--ink);flex:none}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn[aria-pressed="true"]{color:var(--cobalt);border-color:var(--cobalt)}
.badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 2px var(--paper)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--glacier);display:grid;place-items:center;font-weight:600;font-size:14px;border:0;color:var(--ink);flex:none}
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:50px;width:min(370px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 48px var(--shadow);padding:10px;z-index:30;max-height:70vh;overflow:auto}
.pop h2{font-size:15px;margin:6px 8px 8px}
.note{display:flex;gap:12px;padding:10px 8px}
.note + .note{border-top:1px solid var(--line)}
.note .sub{font-size:12.5px}
.note-dot{width:8px;height:8px;border-radius:50%;background:var(--cobalt);margin-top:8px;flex:none}
.note.read .note-dot{background:transparent}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--alert-soft);color:var(--alert)}
.banner.info{background:var(--cobalt-soft);color:var(--cobalt-ink)}
.banner .btn{margin-left:auto}

/* ---------- Hero & chart ---------- */
.hero{background:var(--paper);border-radius:var(--r-lg);border:1px solid var(--line);padding:26px 28px 0;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero-label{margin:0;color:var(--muted);font-weight:500}
.total{font-size:clamp(38px,6vw,64px);font-weight:300;letter-spacing:-.04em;line-height:1;margin:8px 0 10px}
.total .cur{font-size:.36em;font-weight:500;letter-spacing:0;color:var(--muted);margin-right:.4em;vertical-align:.95em}
.delta{margin:0;color:var(--credit);font-weight:500;font-size:14px}
.delta.neg{color:var(--alert)}
.seg{display:inline-flex;background:var(--ice);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(22,32,51,.14)}
.ridge{position:relative;height:230px;margin:14px -28px 0;cursor:crosshair;touch-action:pan-y;outline:none}
.ridge:focus-visible{box-shadow:inset 0 0 0 2px var(--cobalt)}
.ridge svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ridge .area{fill:var(--glacier);opacity:.7}
.ridge .line{fill:none;stroke:var(--cobalt);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.scrub{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:0;pointer-events:none}
.knob{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--cobalt);transform:translate(-50%,-50%);pointer-events:none}
.knob::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--cobalt);opacity:.35;animation:livepulse2 2s infinite}
.ridge.active .knob::after{display:none}
@keyframes livepulse2{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.tip{position:absolute;top:10px;transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:4px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap;pointer-events:none;opacity:0}
.ridge.active .scrub,.ridge.active .tip{opacity:1}

/* ---------- Quick actions ---------- */
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}
.qa{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--paper);text-align:left;font-weight:500}
.qa{min-width:0}
.qa:hover{border-color:var(--line-2)}
.qa .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ice);color:var(--link);flex:none}
.qa.primary{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.qa.primary:hover{background:var(--cobalt-ink)}
.qa.primary .ic{background:rgba(255,255,255,.16);color:#fff}

/* ---------- Panels & lists ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.grid2.g-mood{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
.grid-asset{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:18px;align-content:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel h2{font-size:16px;font-weight:600;margin:0}
.panel h3{font-size:14px;font-weight:600;margin:18px 0 6px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--link);font-weight:500;padding:4px 2px;border-radius:6px}
.link:hover{text-decoration:underline}
.sub{color:var(--muted);font-size:13.5px}
.coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;flex:none;letter-spacing:.02em}
.coin.sm{width:28px;height:28px;font-size:9.5px}
.coin.lg{width:54px;height:54px;font-size:15px}
.hold,.tx{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 8px;border:0;background:none;width:100%;text-align:left;border-radius:12px}
.hold:hover,.tx:hover{background:var(--ice)}
.hold .nm,.tx .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hold .r,.tx .r{text-align:right;display:grid;justify-items:end}
.tx .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ice);color:var(--ink)}
.tx .av.in{background:var(--glacier)}
.up{color:var(--credit)}
.down{color:var(--alert)}
.in-amt{color:var(--credit)}
.day-head{font-size:13px;color:var(--muted);font-weight:500;margin:16px 8px 2px}
.day-head:first-child{margin-top:4px}
.empty{padding:28px 8px;text-align:center;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.ph + .row,.row.first{border-top:0}
.row .nm{font-weight:500}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--ice);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.warn{background:var(--alert-soft);color:var(--alert)}
.tag.ok{background:var(--credit-soft);color:var(--credit)}
.tag.pend{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--cobalt-soft);color:var(--cobalt-ink)}
.flash-up{animation:fup .9s ease-out}
.flash-down{animation:fdown .9s ease-out}
@keyframes fup{from{background:rgba(17,128,90,.16)}}
@keyframes fdown{from{background:rgba(201,48,42,.14)}}
.flash-up,.flash-down{border-radius:6px}

/* markets */
.mkt{display:flex;align-items:center;gap:4px;border-radius:12px}
.mkt:hover{background:var(--ice)}
.star{width:34px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--line-2);flex:none}
.star[aria-pressed="true"]{color:#E0A100}
.star:hover{color:#E0A100}
.mkt-main{flex:1;min-width:0;display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) 80px 110px minmax(0,1fr);gap:12px;align-items:center;padding:9px 8px 9px 0;border:0;background:none;text-align:left}
.mkt-head{display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,1fr) 80px 110px minmax(0,1fr);gap:12px;padding:6px 8px 6px 38px;font-size:12.5px;color:var(--muted);font-weight:500}
.mkt-main .nm{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta-r{text-align:right}
.spark{display:block;width:110px;height:32px}
.spark path{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}

/* asset page */
.asset-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.asset-head h2{font-size:22px;margin:0;font-weight:600}
.asset-head .grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 18px;margin:6px 0 0}
.stats div{display:grid;gap:2px}
.stats dt{color:var(--muted);font-size:13px}
.stats dd{margin:0;font-weight:500}
.pos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:8px 0 16px}
.pos div{background:var(--ice);border-radius:var(--r-sm);padding:10px 12px}
.pos dt{font-size:12.5px;color:var(--muted)}
.pos dd{margin:0;font-weight:500}

/* ---------- Controls ---------- */
.btn{padding:10px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn.primary:hover{background:var(--cobalt-ink);border-color:var(--cobalt-ink)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn.danger{color:var(--alert)}
.btn.danger-fill{background:var(--alert);border-color:var(--alert);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.actions.split > *{flex:1}
.field{display:grid;gap:6px;margin-bottom:14px}
.field > label,.lbl-t{font-weight:500;font-size:14px}
.input,select.input,textarea.input{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field)}
.input:focus{outline:2px solid var(--ring);border-color:var(--cobalt)}
.input[aria-invalid="true"],.money-in.bad{border-color:var(--alert)}
.money-in{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);padding-left:12px;gap:4px}
.money-in:focus-within{outline:2px solid var(--ring);border-color:var(--cobalt)}
.money-in > span{color:var(--muted);font-weight:500}
.money-in input{border:0;outline:0;padding:11px 8px;width:100%;min-width:0;font-size:22px;font-weight:500;background:none;font-variant-numeric:tabular-nums}
.money-in .btn{margin-right:6px}
.err{color:var(--alert);font-size:13px;margin:0}
.hint{color:var(--muted);font-size:13px;margin:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;border:0;padding:0;margin:0 0 14px;min-width:0}
.choices legend{font-weight:500;font-size:14px;margin-bottom:6px;padding:0}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.choice span{display:block;text-align:center;padding:9px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:13.5px;font-weight:500}
.choice input:checked + span{border-color:var(--cobalt);background:var(--cobalt-soft);color:var(--cobalt-ink)}
.choice input:focus-visible + span{outline:2px solid var(--cobalt);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:14px}
.check input{width:18px;height:18px;accent-color:var(--cobalt);margin:2px 0 0;flex:none}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--switch-off);position:relative;flex:none;margin:0;transition:background .18s;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s}
.switch:checked{background:var(--cobalt)}
.switch:checked::after{transform:translateX(18px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid var(--line-2);background:var(--paper);padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
.search{position:relative}
.search > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.meter{height:8px;border-radius:4px;background:var(--ice);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cobalt);border-radius:4px;transition:width .3s}
.warn-box{background:var(--amber-soft);color:var(--amber-ink);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;margin:0 0 14px}
.info-box{background:var(--ice);border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;margin:0 0 14px}
.addr-box{display:flex;align-items:center;gap:10px;background:var(--ice);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px}
.addr-box .mono{flex:1}
.qr{display:grid;place-items:center;margin:4px 0 14px}
.qr svg{width:188px;height:188px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .16s ease-out}
.modal{background:var(--paper);border-radius:var(--r-lg);width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 28px 70px var(--shadow);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 4px 22px;position:sticky;top:0;background:var(--paper);z-index:1}
.m-head h2{font-size:18px;margin:0;font-weight:600}
.m-head .icon-btn{width:36px;height:36px;border:0;background:var(--ice)}
.m-body{padding:12px 22px 22px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps span{height:3px;flex:1;background:var(--line);border-radius:3px}
.steps span.on{background:var(--cobalt)}
dl.sum{margin:0 0 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
dl.sum .total-row{border-top:1px solid var(--line);padding-top:10px}
.big-amt{font-size:38px;font-weight:300;letter-spacing:-.035em;margin:4px 0 18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.1}
.done{text-align:center;padding:8px 0 4px}
.ok-ring{width:64px;height:64px;border-radius:50%;background:var(--credit-soft);color:var(--credit);display:grid;place-items:center;margin:4px auto 14px}
.ok-ring.pend{background:var(--amber-soft);color:var(--amber)}
.approve{display:flex;gap:14px;align-items:center;background:var(--ice);border-radius:var(--r-md);padding:14px;margin-bottom:16px}
.phone{width:40px;height:40px;border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--cobalt);animation:pulse 1.6s ease-in-out infinite;flex:none}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(43,71,245,.12)}}
.code-in{letter-spacing:.5em;font-size:22px;text-align:center;font-variant-numeric:tabular-nums}
.quote{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:-4px 0 14px}
.quote .meter{flex:1;height:4px}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cobalt);animation:spin .8s linear infinite;margin:10px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-conf{display:flex;gap:4px;margin:10px 0 4px}
.progress-conf i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress-conf i.on{background:var(--credit)}
.cam{aspect-ratio:4/3;border-radius:var(--r-md);background:#0B1220;position:relative;overflow:hidden;display:grid;place-items:center;margin-bottom:14px;color:#AFC0D6;font-size:13px}
.cam .oval{width:46%;aspect-ratio:3/4;border:2px dashed rgba(205,234,242,.8);border-radius:50%}
.cam p{position:absolute;bottom:10px;left:0;right:0;text-align:center;margin:0}
.cam .count{position:absolute;font-size:44px;color:#fff;font-weight:300}
.upload{display:grid;place-items:center;gap:6px;border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:24px 14px;text-align:center;margin-bottom:14px;position:relative}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload:focus-within{border-color:var(--cobalt)}
.sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet-btn{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);text-align:left}
.sheet-btn:hover{border-color:var(--line-2);background:var(--ice)}
.sheet-btn .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--cobalt-soft);color:var(--link);flex:none}
.sheet-btn b{display:block;font-weight:600}
.sheet-btn small{color:var(--muted);font-size:12.5px}

/* ---------- Command palette ---------- */
.cmd-list{list-style:none;margin:10px 0 0;padding:0;max-height:340px;overflow:auto}
.cmd-list li{padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.cmd-list li[aria-selected="true"]{background:var(--cobalt-soft);color:var(--cobalt-ink)}
.cmd-list li > svg{color:var(--muted)}
.cmd-list li .sub{margin-left:auto}

/* ---------- Help ---------- */
details.faq{border-top:1px solid var(--line);padding:12px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
details.faq[open] summary::after{content:"−"}
details.faq p{margin:8px 0 0;color:var(--muted)}
.chat{display:flex;flex-direction:column;height:460px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 10px}
.msg{max-width:84%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--ice);font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--cobalt);color:#fff;border-radius:16px 16px 4px 16px}
.msg.typing{color:var(--muted)}
.chat form{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:11px 18px;border-radius:999px;z-index:70;font-weight:500;font-size:14px;box-shadow:0 12px 30px rgba(22,32,51,.25);animation:rise .2s;max-width:calc(100vw - 32px);text-align:center}
.masked{letter-spacing:.05em}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .grid2,.grid2.g-mood,.grid-asset{grid-template-columns:minmax(0,1fr)}
  .search-btn{min-width:0}
  .quick .qa{flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13.5px}
}
@media (max-width:760px){
  .mkt-main,.mkt-head{grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) 70px}
  .mkt-main > :nth-child(5),.mkt-main > :nth-child(6),.mkt-head > :nth-child(5),.mkt-head > :nth-child(6){display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;justify-content:space-around;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--nav-bg);backdrop-filter:blur(10px);z-index:20;gap:0;overflow:visible}
  .side .brand,.side-foot,.nav-extra,.trade-btn,.nav-sep{display:none}
  .nav-more,.nav-trade{display:flex}
  .nav-btn{flex-direction:column;gap:3px;font-size:11.5px;padding:6px 4px;align-items:center;width:auto;flex:1}
  .nav-btn[aria-current="page"]{box-shadow:none;background:none;color:var(--cobalt)}
  .nav-trade .ic{width:44px;height:44px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(43,71,245,.35)}
  #main{padding:16px 16px 104px}
  .top h1{font-size:19px}
  .search-btn .lbl,.search-btn kbd{display:none}
  .search-btn{width:40px;height:40px;padding:0;justify-content:center}
  .hero{padding:20px 20px 0}
  .ridge{margin:12px -20px 0;height:190px}
  .panel{padding:18px}
  .quick{gap:8px}
  .quick .qa{padding:10px 4px;font-size:12.5px;border-radius:12px}
  .quick .qa .ic{width:34px;height:34px}
  .overlay{place-items:end center;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:92vh;width:100%}
  .toast{bottom:96px}
  .sheet-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){ .top .avatar{display:none} .quick .qa{font-size:11.5px} .tx .sub,.hold .sub{font-size:12.5px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .peaks path.l{stroke-dashoffset:0}
}

/* ================= Motion primitives ================= */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:var(--len,2600)}}
@keyframes breathe{50%{transform:scale(1.08);opacity:.8}}
@keyframes shimmer{to{transform:translateX(100%)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes drawck{from{stroke-dashoffset:30}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}}
.btn,.qa,.chip,.sheet-btn,.icon-btn,.key,.nav-btn,.trade-btn,.feat{transition:transform .12s ease,background .18s,border-color .18s,color .18s}
.btn:active,.qa:active,.chip:active,.sheet-btn:active,.icon-btn:active,.trade-btn:active{transform:scale(.97)}
.view-enter > *{animation:fadeUp .42s cubic-bezier(.2,.8,.2,1) both}
.view-enter > *:nth-child(2){animation-delay:.05s}
.view-enter > *:nth-child(3){animation-delay:.1s}
.view-enter > *:nth-child(4){animation-delay:.15s}
.ok-ring{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.ok-ring:not(.pend) svg path{stroke-dasharray:30;animation:drawck .5s .2s ease both}
.ok-ring.bad{background:var(--alert-soft);color:var(--alert)}
.panel,.hero{transition:background .25s,border-color .25s}
.skip{position:absolute;left:12px;top:-60px;z-index:300;background:var(--cobalt);color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}

/* ================= Splash ================= */
#splash{position:fixed;inset:0;z-index:400;background:#060B16;display:grid;place-items:center;color:#fff;transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
.splash-glow{position:absolute;width:min(520px,90vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(77,104,255,.42),rgba(95,182,207,.12) 45%,transparent 68%);filter:blur(10px);animation:breathe 3s ease-in-out infinite}
.splash-in{position:relative;display:grid;justify-items:center;gap:16px}
.splash-logo path{--len:120;stroke-dasharray:120;animation:draw 1.2s cubic-bezier(.3,.6,.2,1) both}
.splash-word{font-size:32px;font-weight:600;letter-spacing:-.03em;animation:fadeUp .6s .45s both}
.splash-sub{color:#8C9BB3;font-size:14px;animation:fadeUp .6s .6s both;margin:-8px 0 6px}
.splash-bar{width:150px;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.splash-bar i{display:block;height:100%;width:45%;border-radius:3px;background:linear-gradient(90deg,#6680FF,#8FE3F5);animation:loadbar 1.1s ease-in-out infinite}
@keyframes loadbar{from{transform:translateX(-100%)}to{transform:translateX(230%)}}

/* ================= Futuristic backdrop (login, landing hero, lock) ================= */
.space{position:relative;background:#060B16;color:#fff;overflow:hidden;isolation:isolate}
.aurora{position:absolute;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 32% at 22% 28%,rgba(77,104,255,.5),transparent 70%),radial-gradient(34% 30% at 74% 18%,rgba(95,182,207,.36),transparent 70%),radial-gradient(40% 40% at 62% 88%,rgba(140,91,232,.32),transparent 70%);
  filter:blur(28px);animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(7deg) scale(1.06)}}
.grid-floor{position:absolute;left:-50%;right:-50%;bottom:-12%;height:52%;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(143,203,219,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(143,203,219,.16) 1px,transparent 1px);background-size:46px 46px;
  transform:perspective(420px) rotateX(64deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000 15%,transparent 85%);mask-image:linear-gradient(to top,#000 15%,transparent 85%);
  animation:gridmove 5s linear infinite}
@keyframes gridmove{to{background-position:0 46px}}
.ridge-art{position:absolute;left:0;right:0;width:100%;z-index:-1;pointer-events:none}
.ridge-art .base{fill:none;stroke:rgba(143,203,219,.38);stroke-width:1.5;vector-effect:non-scaling-stroke}
.ridge-art .base2{fill:none;stroke:rgba(102,128,255,.25);stroke-width:1.2;vector-effect:non-scaling-stroke}
.ridge-art .fill{fill:url(#ridgefill)}
.ridge-art .comet{fill:none;stroke:#BDF3FF;stroke-width:3;stroke-linecap:round;stroke-dasharray:70 1600;animation:comet 6s linear infinite;filter:drop-shadow(0 0 6px #8FE3F5)}
@keyframes comet{from{stroke-dashoffset:1670}to{stroke-dashoffset:0}}
.grad{background:linear-gradient(95deg,#A8B8FF 10%,#8FE3F5 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.live-chips{display:flex;gap:10px;flex-wrap:wrap}
.live-chip{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:13.5px;color:#C9D5E6;white-space:nowrap}
.live-chip b{color:#fff;font-weight:500}
.live-chip .up{color:#3DD39A}.live-chip .down{color:#FF8A82}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;letter-spacing:-.01em}

/* ================= Login ================= */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr minmax(380px,1fr)}
.login-art{position:relative;padding:36px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.login-art h1{font-size:clamp(36px,4.6vw,64px);font-weight:300;letter-spacing:-.045em;line-height:1;margin:0;max-width:12ch}
.login-art .lead{color:#A9B8CE;max-width:42ch;margin:16px 0 22px;font-size:16px}
.login .ridge-art{bottom:14%;height:38%}
.login-form{position:relative;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.glass{width:min(410px,100%);padding:30px 28px;border-radius:26px;background:rgba(15,23,40,.74);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);color:var(--ink);animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
.glass h2{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.glass .sub{margin:0 0 22px}
.glass .input{background:rgba(8,13,24,.7)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#A9B8CE;background:none;border:0;padding:6px 0;font-weight:500}
.back-link:hover{color:#fff}
.demo-note{margin-top:20px;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.secure-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:12.5px;color:var(--muted)}
.secure-row span{display:inline-flex;align-items:center;gap:6px}

/* ================= Landing ================= */
.landing{min-height:100vh;background:var(--ice)}
.lp-head{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px clamp(16px,4vw,48px);transition:background .25s,border-color .25s,backdrop-filter .25s;border-bottom:1px solid transparent;color:#fff}
.lp-head.solid{background:color-mix(in srgb,var(--ice) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:var(--line);color:var(--ink)}
.lp-nav{display:flex;gap:2px;margin-left:18px}
.lp-nav button{background:none;border:0;color:inherit;opacity:.78;padding:8px 12px;border-radius:999px;font-weight:500;font-size:14.5px}
.lp-nav button:hover{opacity:1;background:rgba(127,140,160,.14)}
.lp-head .sp{flex:1}
.lp-head .icon-btn{background:transparent;border-color:rgba(127,140,160,.35);color:inherit}
.lp-head .btn:not(.primary){background:transparent;border-color:rgba(127,140,160,.45);color:inherit}
.lang-sel{background:transparent;color:inherit;border:1px solid rgba(127,140,160,.35);border-radius:999px;padding:8px 10px;font-size:14px}
.lang-sel option{color:#162033}
.lp-hero{padding:clamp(110px,14vw,170px) clamp(16px,4vw,48px) clamp(56px,8vw,90px)}
.lp-hero .ridge-art{bottom:0;height:45%}
.lp-hero-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,64px);align-items:center}
.lp-hero h1{font-size:clamp(42px,6.6vw,88px);font-weight:300;letter-spacing:-.05em;line-height:.98;margin:0;animation:fadeUp .7s both}
.lp-hero .lead{font-size:clamp(16px,1.6vw,19px);color:#A9B8CE;max-width:46ch;margin:22px 0 28px;animation:fadeUp .7s .1s both}
.lp-cta{display:flex;gap:10px;flex-wrap:wrap;animation:fadeUp .7s .2s both}
.btn.lg{padding:14px 26px;font-size:16px}
.btn.on-dark{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22);color:#fff}
.btn.on-dark:hover{border-color:#fff}
.lp-trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;color:#8C9BB3;font-size:13.5px;animation:fadeUp .7s .3s both}
.lp-trust span{display:inline-flex;align-items:center;gap:7px}
.mock{position:relative;border-radius:28px;background:rgba(14,21,37,.82);border:1px solid rgba(255,255,255,.1);padding:22px;box-shadow:0 40px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);animation:fadeUp .8s .2s both;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.mock .m-total{font-size:clamp(30px,3.6vw,44px);font-weight:300;letter-spacing:-.04em;margin:4px 0 2px}
.mock svg.mini{width:100%;height:120px;display:block;margin:10px 0 14px}
.mock-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:14px}
.mock-row .grow{flex:1}
.mock-row .sub{color:#8C9BB3}
.float-chip{position:absolute;padding:10px 14px;border-radius:14px;background:rgba(22,33,54,.92);border:1px solid rgba(255,255,255,.12);font-size:13px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.lp-section{max-width:1180px;margin:0 auto;padding:clamp(56px,8vw,104px) clamp(16px,4vw,48px)}
.lp-section h2{font-size:clamp(28px,3.8vw,46px);font-weight:400;letter-spacing:-.035em;margin:0 0 12px;line-height:1.06;max-width:22ch}
.lp-section .lead2{color:var(--muted);font-size:17px;max-width:56ch;margin:0}
.kicker{color:var(--link);font-weight:600;font-size:14px;margin:0 0 10px}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px}
.feat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.feat:hover{transform:translateY(-3px);border-color:var(--line-2)}
.feat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--cobalt-soft);color:var(--link)}
.feat h3{margin:16px 0 6px;font-size:17px}
.feat p{margin:0;color:var(--muted);font-size:14.5px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px;counter-reset:s}
.step3{padding:24px;border-radius:var(--r-lg);border:1px dashed var(--line-2)}
.step3::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--cobalt);color:#fff;font-weight:600;margin-bottom:14px}
.step3 h3{margin:0 0 6px;font-size:17px}
.step3 p{margin:0;color:var(--muted);font-size:14.5px}
.table-wrap{margin-top:28px;border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto;background:var(--paper)}
table.fees{width:100%;border-collapse:collapse;min-width:520px}
.fees th,.fees td{padding:15px 20px;text-align:left;border-bottom:1px solid var(--line)}
.fees tr:last-child td{border-bottom:0}
.fees th{font-size:13px;color:var(--muted);font-weight:500}
.fees td:last-child,.fees th:last-child{text-align:right}
.sec-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,60px);align-items:center}
.sec-list{display:grid;gap:18px;margin:26px 0 0;padding:0;list-style:none}
.sec-list li{display:flex;gap:14px}
.sec-list .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--credit-soft);color:var(--credit);flex:none}
.sec-list b{display:block;margin-bottom:2px}
.sec-list span{color:var(--muted);font-size:14.5px}
.shield-art{aspect-ratio:1;max-width:420px;width:100%;margin:0 auto;border-radius:32px;display:grid;place-items:center}
.lp-faq{max-width:780px}
.cta-band{margin:0 clamp(16px,4vw,48px) 64px;border-radius:30px;padding:clamp(40px,7vw,72px) 24px;text-align:center}
.cta-band h2{font-size:clamp(28px,4vw,48px);font-weight:300;letter-spacing:-.04em;margin:0 0 12px}
.cta-band p{color:#A9B8CE;margin:0 auto 24px;max-width:44ch}
.lp-foot{max-width:1180px;margin:0 auto;padding:44px clamp(16px,4vw,48px) 18px;display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:28px;border-top:1px solid var(--line)}
.lp-foot h3{font-size:14px;margin:0 0 10px}
.lp-foot .link{display:block;color:var(--muted);font-weight:400;font-size:14px;padding:4px 0;text-align:left}
.lp-foot .link:hover{color:var(--ink)}
.disclaimer{font-size:12.5px;color:var(--muted);max-width:1180px;margin:0 auto;padding:10px clamp(16px,4vw,48px) 110px}
.cookie{position:fixed;left:16px;right:16px;bottom:16px;z-index:60;max-width:580px;margin:0 auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:0 24px 60px var(--shadow);animation:fadeUp .45s .3s both}
.cookie h2{font-size:16px;margin:0 0 4px}
.cookie p{margin:0 0 12px;color:var(--muted);font-size:14px}
.cookie .actions{margin:0;justify-content:flex-start}

/* ================= Header additions ================= */
.icon-btn .ic-sun{display:none}
.icon-btn .ic-moon,.icon-btn .ic-sun{line-height:0}
html[data-theme="dark"] .icon-btn .ic-sun{display:block}
html[data-theme="dark"] .icon-btn .ic-moon{display:none}

/* ================= Skeletons ================= */
.skel{position:relative;overflow:hidden;background:var(--skel);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--skel-hi),transparent);animation:shimmer 1.3s infinite}
.sk-l{height:12px;margin:9px 0}
.sk-row{display:grid;grid-template-columns:40px minmax(0,1fr) 90px;gap:12px;align-items:center;padding:10px 8px}
.sk-c{width:40px;height:40px;border-radius:50%}
.sk-chart{height:210px;margin:18px -28px 0;border-radius:0}
.loading-note{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;margin:0 0 12px}
.dot-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--link);animation:spin .8s linear infinite}

/* ================= Empty & error states ================= */
.state{display:grid;justify-items:center;text-align:center;gap:6px;padding:30px 16px}
.state svg.art{width:128px;height:96px;margin-bottom:6px}
.state h3{margin:0;font-size:16px;font-weight:600}
.state p{margin:0 0 12px;color:var(--muted);font-size:14px;max-width:36ch}
.state .actions{justify-content:center;margin:0}
.state.error .badge-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--alert-soft);color:var(--alert);margin-bottom:6px}

/* ================= Insights ================= */
.donut-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:center}
.donut{width:200px;height:200px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:4.2;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;align-content:center}
.donut .ctr b{font-size:20px;font-weight:500}
.donut.sm{width:96px;height:96px}
.donut.sm .ctr b{font-size:13px}
.legend{display:grid;gap:8px}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.legend i{width:12px;height:12px;border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.kpi dt{color:var(--muted);font-size:13px}
.kpi dd{margin:4px 0 0;font-size:20px;font-weight:500;letter-spacing:-.01em}
.pl-row{display:grid;grid-template-columns:40px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:11px 8px;border-top:1px solid var(--line)}
.pl-head{border-top:0;font-size:12.5px;color:var(--muted);font-weight:500;padding-top:0}
.bar{height:6px;border-radius:3px;background:var(--ice);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}

/* ================= Asset extras ================= */
.gauge{display:grid;justify-items:center;gap:2px}
.gauge svg{width:200px;height:112px}
.gauge b{font-size:28px;font-weight:500;margin-top:-34px}
.news{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 8px;border:0;border-top:1px solid var(--line);background:none;text-align:left;border-radius:0}
.news:first-of-type{border-top:0}
.news:hover{background:var(--ice)}
.news .nm{font-weight:500;display:block}

/* ================= Status ================= */
.st-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.st-dot.ok{background:var(--credit);box-shadow:0 0 0 4px var(--credit-soft)}
.st-dot.slow{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.st-dot.down{background:var(--alert);box-shadow:0 0 0 4px var(--alert-soft)}
.st-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:13px 4px;border-top:1px solid var(--line)}
.st-head{border-top:0;color:var(--muted);font-size:12.5px;font-weight:500;padding-top:0}

/* ================= Gift & request ================= */
.giftcard{aspect-ratio:1.62;border-radius:20px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.2)}
.giftcard.g0{background:linear-gradient(135deg,#2B47F5,#8C5BE8)}
.giftcard.g1{background:linear-gradient(135deg,#0E7C66,#5FB6CF)}
.giftcard.g2{background:linear-gradient(135deg,#D9822B,#C22D78)}
.giftcard b{font-size:28px;font-weight:500;letter-spacing:-.02em}
.giftcard p{margin:0;opacity:.9;font-size:14px;overflow-wrap:anywhere}
.giftcard::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.swatch{width:100%;height:36px;border-radius:10px;display:block}

/* ================= Tour ================= */
.tour-spot{position:fixed;z-index:180;border-radius:18px;box-shadow:0 0 0 9999px rgba(3,6,12,.64),0 0 0 2px #8FE3F5;transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-card{position:fixed;z-index:181;width:min(330px,calc(100vw - 24px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 24px 60px var(--shadow);transition:top .35s cubic-bezier(.2,.8,.2,1),left .35s cubic-bezier(.2,.8,.2,1)}
.tour-card h2{font-size:17px;margin:0 0 6px}
.tour-card p{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.tour-dots{display:flex;gap:5px;margin-right:auto}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.tour-dots i.on{background:var(--cobalt);width:16px;border-radius:3px}

/* ================= Lock screen ================= */
.lock{position:fixed;inset:0;z-index:170;display:grid;place-items:center;padding:24px;overflow:auto}
.lock-card{display:grid;justify-items:center;text-align:center;animation:fadeUp .5s both;color:var(--ink)}
.lock-card .avatar{width:64px;height:64px;font-size:20px;background:linear-gradient(135deg,#6680FF,#8FE3F5);color:#060B16}
.lock-card h2{margin:14px 0 2px;font-size:22px;font-weight:600}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:22px 0 10px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);transition:background .15s,transform .15s}
.pin-dots i.on{background:#8FE3F5;border-color:#8FE3F5;transform:scale(1.1)}
.pin-dots.shake{animation:shake .42s}
.keypad{display:grid;grid-template-columns:repeat(3,70px);gap:14px;justify-content:center;margin:12px 0 18px}
.key{width:70px;height:70px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);font-size:25px;font-weight:300;color:#fff}
.key:hover{background:rgba(255,255,255,.1)}
.key:active{transform:scale(.94);background:rgba(255,255,255,.16)}
.key.txt{font-size:13px;font-weight:500;border-color:transparent;background:none}

/* ================= Special full pages ================= */
.special{position:fixed;inset:0;z-index:160;display:grid;place-items:center;padding:24px;text-align:center;overflow:auto}
.special .big{font-size:clamp(96px,22vw,200px);font-weight:200;letter-spacing:-.06em;line-height:.9;margin:0}
.special h1{font-size:clamp(24px,3.4vw,36px);font-weight:500;letter-spacing:-.02em;margin:10px 0 8px}
.special p{color:#A9B8CE;max-width:44ch;margin:0 auto 24px}
.special .actions{justify-content:center}
.maint-list{display:grid;gap:10px;max-width:360px;margin:0 auto 26px;text-align:left}
.maint-list div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:14px}
.maint-list div span:last-child{margin-left:auto;color:#8C9BB3}

/* ================= Demo controls ================= */
.demo-fab{position:fixed;right:18px;bottom:18px;z-index:45;display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);font-weight:600;font-size:13.5px;box-shadow:0 12px 30px var(--shadow)}
.demo-fab:hover{border-color:var(--ink)}
.demo-grp{margin:0 0 16px}
.demo-grp h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo-grid .btn{justify-content:flex-start;font-weight:500;font-size:13.5px;white-space:normal;text-align:left}
.demo-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.demo-sw:first-of-type{border-top:0}

/* ================= Mobile & responsive for new parts ================= */
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .lp-hero-in,.sec-grid{grid-template-columns:minmax(0,1fr)}
  .feat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lp-nav{display:none}
  .lp-foot{grid-template-columns:1fr 1fr}
  .mock{max-width:520px}
  .float-chip{display:none}
}
@media (max-width:860px){
  .login{grid-template-columns:minmax(0,1fr);align-content:start}
  .login-art{padding:18px 18px 0;gap:14px;justify-content:flex-start}
  .login-art h1{font-size:clamp(30px,8.4vw,38px);max-width:14ch}
  .login-art .lead{display:none}
  .login .live-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
  .login .live-chips::-webkit-scrollbar{display:none}
  .login .ridge-art{top:30px;bottom:auto;height:210px;opacity:.7}
  .login-form{padding:16px 14px 28px;align-items:flex-start}
  .glass{padding:22px 18px;border-radius:22px}
  .glass h2{font-size:22px}
  .glass .sub{margin-bottom:16px}
  .demo-fab{bottom:84px;right:12px;padding:11px}
  .demo-fab .t{display:none}
  body.signed-out .demo-fab{bottom:16px}
  .donut-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .legend{width:100%}
  .pl-row{grid-template-columns:40px minmax(0,1fr) auto}
  .pl-row > :nth-child(3),.pl-row > :nth-child(4){display:none}
  .st-row{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr)}
  .st-row > :nth-child(3){display:none}
  .modal::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0}
  .keypad{grid-template-columns:repeat(3,66px)}
  .key{width:66px;height:66px}
}
@media (max-width:560px){
  .feat-grid,.steps3{grid-template-columns:minmax(0,1fr)}
  .lp-head .hide-sm{display:none}
  .lp-foot{grid-template-columns:minmax(0,1fr)}
  .demo-grid{grid-template-columns:minmax(0,1fr)}
  .kpi dd{font-size:17px}
}
@media (max-height:620px) and (max-width:860px){ .login .ridge-art{display:none} }
@media (prefers-reduced-motion:reduce){ .grid-floor,.aurora,.float-chip{animation:none} }
[tabindex="-1"]:focus:not(:focus-visible),#sp-h:focus{outline:none}

/* ================= Banking components ================= */
.cur-b{font-size:14px;font-weight:600;letter-spacing:0}
.coin.sm.cur-b{font-size:11px}
.cat-b svg,.acct-b svg{width:20px;height:20px}
.coin.sm.cat-b svg,.coin.sm.acct-b svg{width:15px;height:15px}
.acct-b{background:var(--cobalt-soft);color:var(--link)}
.acct-b.t-savings{background:var(--credit-soft);color:var(--credit)}
.acct-b.t-credit{background:color-mix(in srgb,#A855F7 16%,transparent);color:#9B51E0}
.acct-b.t-loan{background:var(--amber-soft);color:var(--amber)}
.avatar.sm{width:40px;height:40px;font-size:13px}
.bar{height:8px;border-radius:999px;background:var(--ice);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.lg{height:10px}
.cat-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.cat-mini>span{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.cat-mini b{color:var(--ink);font-weight:500;font-size:14px}
.pay-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.act-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.act-tools .search{flex:1;min-width:220px;margin:0}
.acct-actions{display:flex;gap:8px;flex-wrap:wrap}
.acct-actions .btn svg{width:18px;height:18px}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn.sm{width:28px;height:28px;display:inline-grid;vertical-align:middle;margin-left:4px}
.icon-btn.sm svg{width:15px;height:15px}
.swap-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--link);margin:-6px auto 8px;cursor:pointer}
.swap-btn:hover{background:var(--ice)}
.cur-sel{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:0 6px 0 0;cursor:pointer}
.fx-quote{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;background:var(--ice);border-radius:var(--r-sm);padding:12px 14px;margin:0 0 16px}
.fx-quote>div{display:grid;gap:2px}
.fx-quote .sub{font-size:12.5px}
.fx-quote b{font-weight:500;font-size:14.5px}
.fx-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fx-tile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:12px;cursor:pointer;color:inherit;font:inherit;min-width:0}
.fx-tile>span:nth-child(2){display:grid;min-width:0;line-height:1.25}
.fx-tile>span:nth-child(2) .sub{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-tile .r{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.fx-tile .r .amt:first-child{font-weight:600;font-size:16px}
.fx-tile .r .sub{font-size:12.5px}
.fx-tile[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt) inset;background:var(--cobalt-soft)}
.fx-tile:hover{border-color:var(--line-2)}
.chat-form{display:flex;gap:8px;margin-top:10px}
.chat-form .input{flex:1}
.st-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;gap:8px;padding:10px 4px;border-top:1px solid var(--line);font-size:14px}
.st-row span:not(:first-child){text-align:right}
.st-head{border-top:0;color:var(--muted);font-size:12.5px;padding-top:0}
.tx-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.pin-show{font-size:44px;letter-spacing:.3em;text-align:center;margin:10px 0;font-weight:500}
.track{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:0}
.track li{position:relative;padding:0 0 14px 26px;color:var(--muted);font-size:14px}
.track li::before{content:'';position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.track li:not(:last-child)::after{content:'';position:absolute;left:9.5px;top:17px;bottom:0;width:1px;background:var(--line)}
.track li.on{color:var(--ink)}
.track li.on::before{background:var(--credit)}
.budget{padding:12px 0;border-top:1px solid var(--line)}
.budget:first-of-type{border-top:0}
.budget-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:8px}
.budget-in label{display:flex;gap:10px;align-items:center}
.leg-btn{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font:inherit;font-size:14px;color:inherit;background:none;border:0;padding:6px 8px;margin:0 -8px;border-radius:8px;text-align:left;cursor:pointer}
.leg-btn:hover{background:var(--ice)}
.leg-btn i{width:12px;height:12px;border-radius:4px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:190px;align-items:end;padding-top:10px}
.bar-col{display:grid;grid-template-rows:1fr auto;height:100%;gap:6px;text-align:center;font-size:12.5px;color:var(--muted)}
.bar-pair{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.bar-pair i{width:min(18px,40%);border-radius:5px 5px 2px 2px;min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar-pair i.in,.legend-inline i.in{background:var(--credit)}
.bar-pair i.out,.legend-inline i.out{background:var(--cobalt)}
.legend-inline{display:flex;gap:18px;font-size:13px;color:var(--muted);margin:12px 0 0}
.legend-inline span{display:flex;gap:6px;align-items:center}
.legend-inline i{width:10px;height:10px;border-radius:3px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.goal h2{font-size:17px;margin:0;font-weight:500}
.goal-top{display:flex;gap:16px;align-items:center}
.ring-wrap{position:relative;width:84px;height:84px;flex:none}
.ring-wrap>span{position:absolute;inset:0;display:grid;place-items:center}
.ring{flex:none}
.ring circle{fill:none;stroke-width:3.4}
.loan-offer{position:relative;overflow:hidden;background:#0B1220;border-color:#1E2A3F;color:#E7EDF6}
.loan-offer>*:not(.aurora){position:relative}
.loan-offer .input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
.loan-offer .input option{color:#162033}
.offer{background:linear-gradient(135deg,var(--cobalt-soft),var(--credit-soft));border-radius:var(--r-md);padding:18px;margin-bottom:16px;text-align:center}
input[type=range]{width:100%;accent-color:var(--cobalt);height:28px;cursor:pointer}
.loan-offer input[type=range]{accent-color:#8FE3F5}

/* Card art */
.bank-card{position:relative;aspect-ratio:1.586;border-radius:18px;padding:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:0 18px 40px -18px rgba(11,18,32,.6);isolation:isolate;text-align:left}
.bank-card::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.22),transparent 55%),radial-gradient(90% 70% at 0% 100%,rgba(143,227,245,.25),transparent 60%)}
.bank-card::after{content:'';position:absolute;right:-30%;bottom:-60%;width:90%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.14);z-index:-1}
.bank-card.d0{background:linear-gradient(135deg,#1C33C9 0%,#2B47F5 45%,#4F8BF7 100%)}
.bank-card.d1{background:linear-gradient(135deg,#0B1220 0%,#1A2540 55%,#34406A 100%)}
.bank-card.d2{background:linear-gradient(135deg,#0E6E73 0%,#1AA39A 50%,#8FE3F5 100%)}
.bc-top{display:flex;justify-content:space-between;align-items:center}
.bc-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.bc-kind{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.bc-chip{width:44px;height:33px}
.bc-num{font-size:clamp(15px,2.2vw,20px);letter-spacing:.12em}
.bc-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;line-height:1.3}
.bc-bot small{opacity:.75;font-size:11px}
.bc-net{font-weight:800;font-style:italic;font-size:20px;letter-spacing:.02em;display:flex;align-items:center}
.bc-net i{width:26px;height:26px;border-radius:50%;background:#EB001B;display:inline-block}
.bc-net i+i{background:#F79E1B;margin-left:-10px;mix-blend-mode:screen}
.bank-card.mini{border-radius:12px;padding:12px 14px;box-shadow:0 10px 24px -14px rgba(11,18,32,.6)}
.bank-card.mini .bc-brand{font-size:13px}
.bank-card.mini .bc-kind{font-size:9px}
.bank-card.mini .bc-num{font-size:13px;letter-spacing:.08em}
.bank-card.mini .bc-bot{font-size:11px}
.bank-card.mini .bc-net{font-size:13px}
.bank-card.mini .bc-net i{width:16px;height:16px}
.bank-card.mini .bc-net i+i{margin-left:-6px}
.bank-card.frozen{filter:saturate(.35)}
.bc-frost{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px;background:rgba(220,235,245,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.bank-card.mini .bc-frost svg{width:18px;height:18px}
.card-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card-btn{border:0;background:none;padding:0;cursor:pointer;border-radius:13px;font:inherit;color:inherit;text-align:left;display:block}
.card-btn:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
.card-picker{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;scroll-snap-type:x mandatory}
.card-picker .card-btn{flex:0 0 190px;scroll-snap-align:start;opacity:.7;transition:opacity .2s,transform .2s}
.card-picker .card-btn[aria-selected="true"]{opacity:1;transform:translateY(-2px);box-shadow:0 0 0 2px var(--cobalt);border-radius:13px}
.card-picker .card-btn:hover{opacity:1}
.card-btn.add{display:grid;place-items:center;align-content:center;gap:6px;border:1.5px dashed var(--line-2);color:var(--link);aspect-ratio:1.586;font-weight:500;font-size:14px;opacity:1}
.card-stage{max-width:380px;margin:6px auto 18px}
.card-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card-actions .btn{flex-direction:column;gap:4px;font-size:13px;padding:10px 6px;height:auto;min-height:64px;display:flex;align-items:center;justify-content:center;border-radius:14px;line-height:1.2;text-align:center}
.card-actions .btn[hidden]{display:none}
.swatch{display:block;height:34px;border-radius:8px}
.lp-card-float{position:absolute;width:176px;right:-40px;top:96px;transform:rotate(-8deg);animation:float 7s ease-in-out infinite;animation-delay:.8s}
:where([data-motion="reduce"]) .lp-card-float{animation:none}

/* Check capture */
.check-cam{aspect-ratio:16/10}
.check-frame{width:82%;aspect-ratio:320/140;border:2px dashed rgba(205,234,242,.75);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.check-art{width:100%;height:100%;display:block}

/* Public info pages */
.brand-btn{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.info-hero{position:relative;overflow:hidden;background:#060B16;color:#fff}
.info-hero h1{font-size:clamp(32px,5vw,54px);font-weight:300;letter-spacing:-.03em;margin:10px 0 0;color:#fff}
.info-hero .lp-section{position:relative}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:#A9B8CE}
.crumbs .link{color:#8FE3F5}
.info-body{padding-block:40px 70px}
.info-body .panel{max-width:860px}
.info-body .lead2{max-width:62ch}
.info-main .kpis{margin-top:24px}

.donut-wrap .donut{width:170px;height:170px}

@media (max-width:860px){ .donut-wrap{grid-template-columns:minmax(0,1fr)} }
#view{padding-bottom:64px}
/* keep the last controls clear of the floating demo button */

footer{padding-bottom:72px}

#main,#view{min-width:0}
.stack>*,.grid2>*,.grid-asset>*,.panel{min-width:0}

/* ================= Avatars ================= */
.av-ini{display:inline-grid;place-items:center;border-radius:50%;background:var(--cobalt);color:#fff;font-weight:600;flex:none;line-height:1}
.av-ini svg{width:45%;height:45%}
.av-biz{display:inline-grid;place-items:center;border-radius:50%;background:var(--cobalt-soft);color:var(--link);flex:none}
.av-wrap{position:relative;display:inline-flex;flex:none}
.av-wrap>svg{display:block;border-radius:50%}
.av-flag{position:absolute;right:-3px;bottom:-3px;border-radius:50%;box-shadow:0 0 0 2px var(--paper)}
.coin.xs.cur-b{width:18px;height:18px;font-size:9px}
.top-av{padding:0;overflow:hidden;background:transparent}
.top-av svg,.top-av img,.top-av .av-ini{display:block}
.top-av:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.lock-av{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px rgba(143,227,245,.35)}
.prof-head{display:flex;gap:16px;align-items:center;margin:0 0 16px}
.prof-av{position:relative;flex:none}
.prof-av>svg,.prof-av>img,.prof-av>.av-ini{border-radius:50%;display:block}
.prof-cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;border:2px solid var(--paper);background:var(--cobalt);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.prof-cam svg{width:15px;height:15px}
.photo-prev{display:grid;place-items:center;margin:4px 0 16px}
.photo-prev>svg,.photo-prev-img,.photo-prev .av-ini{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px var(--cobalt-soft)}
#ph-up{cursor:pointer}
#ph-file:focus-visible+*,#ph-up:focus-within{outline:2px solid var(--cobalt)}
.av-pick{border:0;padding:0;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.av-pick legend{font-size:14px;font-weight:500;margin:0 auto 10px;text-align:center;width:100%}
.av-opt{position:relative;cursor:pointer;border-radius:50%}
.av-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.av-opt>span:not(.sr-only){display:block;border-radius:50%;box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.av-opt>span svg{display:block}
.av-opt input:checked+span{box-shadow:0 0 0 3px var(--cobalt)}
.av-opt input:focus-visible+span{outline:2px solid var(--cobalt);outline-offset:4px}

/* Send again */
.send-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.send-row::-webkit-scrollbar{display:none}
.send-p{display:grid;justify-items:center;gap:6px;background:none;border:0;padding:4px 2px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;border-radius:12px;min-width:62px}
.send-p:hover{background:var(--ice)}
.send-p:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.send-p>span:last-child{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av-new{width:52px;height:52px;border-radius:50%;border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--link)}

/* Balance refresh */
.upd{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12.5px;color:var(--muted);font-weight:400}
.icon-btn.xs{width:24px;height:24px;border-width:0;background:transparent}
.icon-btn.xs svg{width:14px;height:14px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
:where([data-motion="reduce"]) .icon-btn.spin svg{animation:none}

/* Chat */
.agent-head{display:flex;gap:12px;align-items:center}
.agent-head h2{margin:0}
.av-online{position:relative;display:inline-flex}
.av-online>svg{border-radius:50%}
.av-online i{position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#22C55E;border:2px solid var(--paper)}
.msg-row{display:flex;gap:8px;align-items:flex-end;margin:0}
.msg-row.me{justify-content:flex-end}
.msg-row>svg,.msg-row>img,.msg-row>.av-ini{border-radius:50%;flex:none;width:28px;height:28px}
.msg-row .msg{margin:0}

/* More sheet */
.more-prof{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:linear-gradient(135deg,var(--cobalt-soft),var(--paper));font:inherit;color:inherit;text-align:left;cursor:pointer;margin:0 0 6px}
.more-prof b{display:block;font-size:16px;font-weight:600}
.more-prof small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-prof-av{border-radius:50%;overflow:hidden;flex:none;display:block;width:56px;height:56px}
.more-prof-av>*{display:block}
.more-chev{display:grid;color:var(--muted);transform:rotate(180deg);flex:none}
.more-chev svg{width:18px;height:18px}
.more-h{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 10px}
.more-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.more-tile{display:grid;justify-items:center;gap:8px;padding:14px 6px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--paper);font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;text-align:center}
.more-tile:hover{border-color:var(--line-2);background:var(--ice)}
.more-tile[aria-current="page"]{border-color:var(--cobalt);box-shadow:0 0 0 1px var(--cobalt) inset}
.more-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.more-ic.sm{width:36px;height:36px;border-radius:11px;background:var(--ice);color:var(--link)}
.more-ic.sm svg{width:18px;height:18px}
.more-list{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--paper)}
.more-row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.more-row:first-child{border-top:0}
.more-row:hover{background:var(--ice)}
.more-row[aria-current="page"]{background:var(--cobalt-soft)}
.more-row .grow{flex:1;min-width:0}
.more-out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:16px 0 0;padding:13px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--paper);font:inherit;font-weight:600;color:var(--alert);cursor:pointer}
.more-out:hover{background:var(--alert-soft)}
.more-ver{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 2px}

/* Landing support team */
.lp-team-wrap{background:linear-gradient(180deg,var(--ice),var(--paper));border-top:1px solid var(--line)}
.team-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center}
.team-art{position:relative;min-height:420px;border-radius:28px;overflow:hidden;background:#0B1220;display:grid;place-items:center;isolation:isolate}
.team-portrait{position:relative;display:grid;place-items:center}
.team-portrait>svg{border-radius:50%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);position:relative;z-index:1}
.team-portrait .ring{position:absolute;border-radius:50%;border:1px solid rgba(143,227,245,.28)}
.team-portrait .r1{inset:-26px}
.team-portrait .r2{inset:-58px;border-color:rgba(143,227,245,.14)}
.bubble{position:absolute;max-width:230px;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.4;box-shadow:0 16px 36px -16px rgba(0,0,0,.6);z-index:2}
.bubble.cust{top:34px;left:26px;background:#1C2A45;color:#E7EDF6;border-bottom-left-radius:4px}
.bubble.agent{bottom:40px;right:22px;background:#fff;color:#162033;display:flex;gap:8px;align-items:flex-start;border-bottom-right-radius:4px}
.bubble.agent svg{border-radius:50%;flex:none}
.team-chip{position:absolute;top:44px;right:22px;z-index:2}
.team-stats{display:flex;gap:28px;margin:22px 0;flex-wrap:wrap}
.team-stats div{display:grid;gap:2px}
.team-stats dt{font-size:13px;color:var(--muted)}
.team-stats dd{margin:0;font-size:26px;font-weight:300;letter-spacing:-.02em}
.team-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.team-list li{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.team-list svg{border-radius:50%;flex:none}
.team-list b{display:block;font-weight:600}
.team-list span{font-size:13.5px;color:var(--muted)}

@media (max-width:980px){ .team-grid{grid-template-columns:minmax(0,1fr);gap:32px} .team-art{min-height:380px} }

/* ================= Landing: hero photo composition ================= */
.lp-hero h1,.lp-hero .lead{animation:none}
.rv{display:inline-block;opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .8s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
p.rv,div.rv{display:block}
.lp-cta.rv{display:flex}
.lp-trust.rv{display:flex}
.rv.in{opacity:1;transform:none}
.hero-visual{position:relative;max-width:470px;justify-self:center;width:100%;padding:24px 34px 40px 40px}
.hero-photo{margin:0;position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(160deg,#1C2A45,#0B1220);box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08);
  clip-path:inset(100% 0 0 0 round 30px);animation:photoIn 1.1s cubic-bezier(.2,.8,.2,1) .25s forwards}
.hero-photo .ph,.hero-photo .ph-fb{width:100%;height:100%;object-fit:cover;display:block;animation:kenburns 16s ease-in-out 1.3s infinite alternate;transform-origin:50% 35%}
.hero-photo .ph-fb{display:grid;place-items:end center;background:#CDEAF2}
.hero-photo .ph-fb svg{width:100%;height:auto}
.hero-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,22,.55),transparent 22%,transparent 70%,rgba(6,11,22,.45));pointer-events:none}
.hp-cap{position:absolute;left:18px;right:18px;top:16px;z-index:1;display:flex;align-items:center;gap:8px;color:#fff;font-size:13.5px;font-weight:500}
.hp-dot{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.25);animation:livepulse2 2s infinite}
.hv-balance{position:absolute;left:-6px;bottom:0;width:230px;padding:14px 16px 8px;border-radius:18px;background:rgba(17,26,43,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.7);opacity:0;animation:popIn .7s cubic-bezier(.2,.8,.2,1) 1.05s forwards,floaty 6s ease-in-out 2s infinite}
.hv-balance .mini{height:46px;width:100%;display:block;margin-top:6px}
.hvb-total{font-size:24px;font-weight:300;letter-spacing:-.02em;margin:2px 0}
.hero-visual .lp-card-float{position:absolute;width:170px;right:-6px;top:0;transform:rotate(7deg);opacity:0;animation:cardIn .8s cubic-bezier(.2,.8,.2,1) .8s forwards,cardFloat 7s ease-in-out 1.8s infinite}
.hv-chip{opacity:0}
.hv-chip.c1{top:42%;right:-26px;animation:popIn .6s cubic-bezier(.2,.8,.2,1) 1.4s forwards,floaty 5s ease-in-out 2.2s infinite}
.hv-chip.c2{top:58%;left:-12px;animation:popIn .6s cubic-bezier(.2,.8,.2,1) 1.75s forwards,floaty 5.5s ease-in-out 2.6s infinite}
@keyframes photoIn{to{clip-path:inset(0 0 0 0 round 30px)}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07) translateY(-1.5%)}}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(-20px) rotate(16deg)}to{opacity:1;transform:rotate(7deg)}}
@keyframes cardFloat{0%,100%{transform:rotate(7deg) translateY(0)}50%{transform:rotate(5deg) translateY(-10px)}}

/* Scroll reveal */
[data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .75s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .75s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
[data-reveal].in{opacity:1;transform:none}
tr[data-reveal]{transform:none}

/* Testimonials */
.rv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:26px}
.rv-head .lead2{margin-bottom:0}
.rv-score{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.rv-num{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1}
.rv-score>div{display:grid;gap:4px}
.stars{display:inline-flex;gap:2px}
.rv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.rv-card{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .25s,box-shadow .25s,border-color .25s,opacity .75s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.rv-card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(22,32,51,.35);border-color:var(--line-2)}
.rv-card blockquote{margin:0;font-size:15.5px;line-height:1.6;flex:1}
.rv-card figcaption{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.rv-card figcaption b{display:block;font-weight:600}
.rv-card figcaption .sub{font-size:13px}
.rv-ph{width:52px!important;height:52px!important;border-radius:50%;object-fit:cover;flex:none;background:var(--ice);display:block}
span.rv-ph{overflow:hidden}
span.rv-ph svg{width:52px;height:52px;display:block}
.rv-tag{margin-left:auto}
.rv-note{font-size:12.5px;color:var(--muted);margin:18px 0 0;max-width:80ch}

  .hero-photo,.hero-photo .ph,.hv-balance,.hero-visual .lp-card-float,.hv-chip,.hp-dot{animation:none!important;clip-path:none;opacity:1}
  [data-reveal],.rv{opacity:1;transform:none;transition:none}
}

  .hv-chip{display:none}
}

.rv-card figcaption{flex-wrap:nowrap}

    focusFirst(){ const f = $('.m-body [data-autofocus]', ov) || $('.m-body input:not([type=radio]):not([type=checkbox]), .m-body select', ov) || $$(FOCUSABLE, $('.m-body', ov))[0] || $('[data-close]', ov); f && f.focus(); },

    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${line}L${W},${H}L0,${H}Z"/><path class="line" d="${line}"/></svg>

function ringSVG(p, color, n = 64){

  return `<svg class="ring" width="${n}" height="${n}" viewBox="0 0 36 36" aria-hidden="true"><circle r="${r}" cx="18" cy="18" style="stroke:var(--ice)"/><circle r="${r}" cx="18" cy="18" style="stroke:${color}" stroke-dasharray="${v.toFixed(1)} ${(100 - v).toFixed(1)}" stroke-dashoffset="25" stroke-linecap="round"/></svg>`;
}

    return `
