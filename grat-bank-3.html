      <div class="fx-grid">${CUR_LIST.filter(c => c !== 'USD').map(c => `<button class="fx-tile" data-act="fxpair:${c}" aria-pressed="${pair === c}">${curBadge(c)}<span><b>${c}</b><span class="sub">${CURS[c].name}</span></span><span class="r"><span class="amt" data-live="fx:${c}">${rateF(CURS[c].rate)}</span><span class="sub amt" data-live="fxc:${c}">${pct(fxChg(c))}</span></span></button>`).join('')}</div>
    </section>
    <div class="grid-asset" style="margin-top:18px">
      <section class="hero" aria-labelledby="h-fx">
        <div class="hero-top"><div><p class="hero-label" id="h-fx">USD to ${pair}, last 90 days</p><p class="total amt" id="fx-now" style="font-size:clamp(30px,4vw,44px)">${rateF(CURS[pair].rate)}</p><p class="delta" id="fx-delta" style="color:var(--muted)"></p></div></div>
        <div class="ridge" id="fx-chart" tabindex="0" role="slider" aria-label="Exchange rate history. Use arrow keys to move through time."></div>
      </section>
      <div class="stack">
        <section class="panel" aria-labelledby="h-conv"><div class="ph"><h2 id="h-conv">Quick converter</h2></div>
          <div class="field"><label for="cv-amt">Amount</label><div class="money-in"><select id="cv-from" aria-label="From currency" class="cur-sel">${CUR_LIST.map(c => `<option ${c === 'USD' ? 'selected' : ''}>${c}</option>`).join('')}</select><input id="cv-amt" inputmode="decimal" value="1000" autocomplete="off"></div></div>
          <div class="field"><label for="cv-to">Converts to</label><div class="money-in"><select id="cv-to" aria-label="To currency" class="cur-sel">${CUR_LIST.map(c => `<option ${c === pair ? 'selected' : ''}>${c}</option>`).join('')}</select><output id="cv-out" class="amt" for="cv-amt cv-from cv-to" style="padding:11px 0"></output></div></div>
          <p class="hint" id="cv-note">Mid-market rate. Grat charges 0.35% to exchange.</p>
          <button class="btn primary block" data-act="exchange:${pair}">Exchange money</button>
        </section>
        <section class="panel" aria-labelledby="h-ca"><div class="ph"><h2 id="h-ca">Your currency accounts</h2></div>
          ${cur.map(acctRow).join('') || stateBlock({icon:'globe', title:'No currency accounts', text:'Open one to hold euros, pounds, yen and more.', actions:[['Open account','open-cur:EUR',true]]})}
        </section>
      </div>
    </div>`;
  },

  insights(){
    const now = spentByCat(monthStart()), last = spentByCat(monthStart(-1), monthStart());
    const tot = Object.values(now).reduce((s, v) => s + v, 0), totL = Object.values(last).reduce((s, v) => s + v, 0);
    const inc = state.txns.filter(t => t.ts >= monthStart() && t.cat === 'income').reduce((s, t) => s + toUsd(t.amt, t.cur), 0);
    const saved = state.txns.filter(t => t.ts >= monthStart() && t.cat === 'savings' && t.amt < 0).reduce((s, t) => s - toUsd(t.amt, t.cur), 0);
    const segs = SPEND_CATS.filter(c => now[c] > 0).sort((a, b) => now[b] - now[a]).map(c => ({label:CATS[c].n, color:CATS[c].c, val:now[c], cat:c}));
    const months = Array.from({length:6}, (_, i) => { const f = monthStart(i - 5), t = monthStart(i - 4); let inn = 0, out = 0; state.txns.forEach(x => { if (x.ts >= f && x.ts < t && x.acct === 'chk'){ if (x.amt > 0) inn += x.amt; else out -= x.amt; } }); return {lbl: new Intl.DateTimeFormat('en-GB', {month:'short'}).format(f), inn, out}; });
    const mx = Math.max(...months.map(m => Math.max(m.inn, m.out)), 1);
    const merch = {}; state.txns.forEach(t => { if (t.ts >= monthStart() && t.amt < 0 && SPEND_CATS.includes(t.cat)) merch[t.desc] = (merch[t.desc] || 0) - toUsd(t.amt, t.cur); });
    const topM = Object.entries(merch).sort((a, b) => b[1] - a[1]).slice(0, 5);
    const diff = totL ? (tot - totL) / totL * 100 : 0;
    return `
    <dl class="kpis">
      <div class="kpi"><dt>Money in this month</dt><dd class="amt up">${fiat(inc)}</dd></div>
      <div class="kpi"><dt>Spent this month</dt><dd class="amt">${fiat(tot)}</dd></div>
      <div class="kpi"><dt>Moved to savings</dt><dd class="amt">${fiat(saved)}</dd></div>
      <div class="kpi"><dt>Compared with last month</dt><dd class="amt ${diff <= 0 ? 'up' : 'down'}">${pct(diff)}</dd></div>
    </dl>
    <div class="grid2">
      <section class="panel" aria-labelledby="h-cat"><div class="ph"><h2 id="h-cat">Where your money went</h2><span class="sub">This month</span></div>
        ${segs.length ? `<div class="donut-wrap">${donutSVG(segs, tot, {center:`<span class="sub" style="font-size:12px">Spent</span><b class="amt">${fiat(tot, {dec:0})}</b>`})}
          <div class="legend">${segs.map(s => `<button class="leg-btn" data-act="cat-activity:${s.cat}"><i style="background:${s.color}"></i><span>${s.label}</span><span class="amt sub">${fiat(s.val, {dec:0})}</span></button>`).join('')}</div></div>`
          : stateBlock({icon:'pie', title:'No spending yet this month', text:'Once you use your card or pay bills, we’ll break it down by category here.'})}
      </section>
      <section class="panel" aria-labelledby="h-bud"><div class="ph"><h2 id="h-bud">Budgets</h2><button class="btn small" data-act="budgets">${I.edit} Edit</button></div>
        ${Object.entries(state.budgets).map(([c, lim]) => { const s = now[c] || 0, p = s / lim; return `<div class="budget"><div class="budget-top">${catIcon(c, 'sm')}<span class="nm">${CATS[c].n}</span><span class="amt ${p > 1 ? 'down' : ''}">${fiat(s, {dec:0})} <span class="sub">of ${fiat(lim, {dec:0})}</span></span></div>
          <div class="bar" role="progressbar" aria-label="${CATS[c].n} budget used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(p, 1) * 100)}"><i style="width:${Math.min(100, p * 100)}%;background:${p > 1 ? 'var(--alert)' : p > .85 ? 'var(--amber)' : CATS[c].c}"></i></div>
          ${p > 1 ? `<p class="err" style="margin:4px 0 0">${fiat(s - lim, {dec:0})} over budget</p>` : p > .85 ? `<p class="hint" style="margin:4px 0 0;color:var(--amber)">${lim - s < 1 ? 'Budget reached for this month' : `Nearly there: ${fiat(lim - s, {dec:0})} left`}</p>` : ''}</div>`; }).join('')
          || stateBlock({icon:'target', title:'No budgets set', text:'Set a monthly limit for the categories you want to keep an eye on.', actions:[['Set budgets','budgets',true]]})}
      </section>
    </div>
    <div class="grid2" style="margin-top:18px">
      <section class="panel" aria-labelledby="h-cf"><div class="ph"><h2 id="h-cf">Money in and out, Everyday Checking</h2></div>
        <div class="bars" role="img" aria-label="${months.map(m => `${m.lbl}: in ${fiat(m.inn, {force:true, dec:0})}, out ${fiat(m.out, {force:true, dec:0})}`).join('; ')}">${months.map(m => `<div class="bar-col"><div class="bar-pair"><i class="in" style="height:${m.inn / mx * 100}%"></i><i class="out" style="height:${m.out / mx * 100}%"></i></div><span>${m.lbl}</span></div>`).join('')}</div>
        <p class="legend-inline"><span><i class="in"></i>Money in</span><span><i class="out"></i>Money out</span></p>
      </section>
      <section class="panel" aria-labelledby="h-top"><div class="ph"><h2 id="h-top">Top places this month</h2></div>
        ${topM.map(([n, v], i) => `<div class="row ${i ? '' : 'first'}"><div class="nm">${esc(n)}</div><span class="amt">${fiat(v)}</span></div>`).join('') || stateBlock({icon:'bag', title:'Nothing yet', text:'Your most visited shops and restaurants will appear here.'})}
      </section>
    </div>`;
  },

  goals(){
    const tot = state.goals.reduce((s, g) => s + g.saved, 0);
    const ru = state.txns.filter(t => t.ts >= monthStart() && t.type === 'card' && t.amt < 0 && t.cur === 'USD').reduce((s, t) => s + (Math.ceil(-t.amt) + t.amt), 0);
    return `
    <section class="hero" style="padding-bottom:26px"><div class="hero-top">
      <div><p class="hero-label">Saved across goals</p><p class="total amt">${heroNum(tot)}</p><p class="delta" style="color:var(--muted)">${state.goals.length} goal${state.goals.length === 1 ? '' : 's'}. Money in goals is protected and earns 4.10% APY.</p></div>
      <button class="btn primary" data-act="goal-new">${I.plus} New goal</button></div></section>
    <div class="goal-grid" style="margin-top:18px">
      ${state.goals.map(g => { const p = g.saved / g.target, months = Math.max(1, Math.round((g.by - Date.now()) / (30 * DAY))), need = Math.max(0, (g.target - g.saved) / months); return `
      <section class="panel goal" aria-labelledby="gh-${g.id}">
        <div class="goal-top"><div class="ring-wrap">${ringSVG(p, g.color, 84)}<span style="color:${g.color}">${I[g.ic]}</span></div>
          <div style="min-width:0"><h2 id="gh-${g.id}">${esc(g.name)}</h2><p class="amt" style="font-size:22px;font-weight:500;margin:2px 0">${fiat(g.saved)}</p><p class="sub" style="margin:0">of ${fiat(g.target, {dec:0})}, ${Math.round(p * 100)}%</p></div></div>
        <p class="sub" style="margin:12px 0">${p >= 1 ? '<span class="tag ok">Goal reached</span> Nicely done.' : `Save about <b class="amt">${fiat(need, {dec:0})}</b> a month to reach it by ${dateFmt.full.format(g.by)}.`}</p>
        <div class="actions" style="justify-content:flex-start;margin:0"><button class="btn small primary" data-act="goal-add:${g.id}">${I.plus} Add money</button><button class="btn small" data-act="goal-out:${g.id}" ${g.saved <= 0 ? 'disabled' : ''}>Withdraw</button><button class="btn small danger" data-act="goal-del:${g.id}" aria-label="Delete ${esc(g.name)} goal">${I.trash}</button></div>
      </section>`; }).join('') || `<section class="panel" style="grid-column:1/-1">${stateBlock({icon:'target', title:'No goals yet', text:'Name something you’re saving for, set a target, and we’ll help you get there.', actions:[['Create a goal','goal-new',true]]})}</section>`}
    </div>
    <section class="panel" style="margin-top:18px" aria-labelledby="h-ru"><div class="ph"><h2 id="h-ru">Round-ups</h2><span class="tag ${state.roundUps ? 'ok' : 'pend'}">${state.roundUps ? 'On' : 'Off'}</span></div>
      <div class="row first"><label for="sw-ru" style="cursor:pointer"><div class="nm">Round up card payments</div><div class="sub">Each debit card payment is rounded up to the next dollar, and the change goes to a goal. About ${fiat(ru)} this month.</div></label><input type="checkbox" role="switch" class="switch" id="sw-ru" data-set="roundUps" ${state.roundUps ? 'checked' : ''}></div>
      ${state.goals.length ? `<div class="row"><label for="ru-goal"><div class="nm">Send round-ups to</div></label><select class="input" id="ru-goal" data-set="roundGoal" style="width:auto" ${state.roundUps ? '' : 'disabled'}>${state.goals.map(g => `<option value="${g.id}" ${state.roundGoal === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>` : ''}
    </section>`;
  },

  loans(){
    const ln = ACC('loan'), cc = ACC('cc');
    let sched = '';
    if (ln){ let bal = -ln.bal, t = ln.due; const r = ln.rate / 100 / 12; for (let i = 0; i < 6 && bal > 0; i++){ const int = bal * r, prin = Math.min(bal, ln.pay - int); bal -= prin; sched += `<div class="st-row"><span>${dateFmt.short.format(t)}</span><span class="amt">${money(prin, 'USD')}</span><span class="amt">${money(int, 'USD')}</span><span class="amt">${money(bal, 'USD')}</span></div>`; const d = new Date(t); d.setMonth(d.getMonth() + 1); t = d.getTime(); } }
    return `
    <div class="grid2">
      <div class="stack">
        ${ln ? `<section class="panel" aria-labelledby="h-ln"><div class="ph"><h2 id="h-ln">${esc(ln.name)}</h2><span class="tag ok">On track</span></div>
          <p class="amt" style="font-size:30px;font-weight:300;margin:0;letter-spacing:-.02em">${money(-ln.bal, 'USD')}</p><p class="sub" style="margin:2px 0 12px">left to pay, ${ln.termM - ln.paidM} of ${ln.termM} payments remaining</p>
          <div class="bar lg" aria-hidden="true"><i style="width:${(1 + ln.bal / ln.orig) * 100}%;background:var(--credit)"></i></div>
          <dl class="sum" style="margin-top:14px"><dt>Monthly payment</dt><dd class="amt">${money(ln.pay, 'USD')}</dd><dt>Next payment</dt><dd>${dateFmt.full.format(ln.due)}</dd><dt>Interest rate</dt><dd>${ln.rate}% APR, fixed</dd></dl>
          <div class="row"><label for="sw-lap" style="cursor:pointer"><div class="nm">Autopay from Everyday Checking</div><div class="sub">Never miss a payment.</div></label><input type="checkbox" role="switch" class="switch" id="sw-lap" data-set="loanAutopay" ${ln.autopay ? 'checked' : ''}></div>
          <div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="loan-pay">Make a payment</button><button class="btn" data-act="payoff">Payoff quote</button></div>
        </section>
        <section class="panel" aria-labelledby="h-sch2"><div class="ph"><h2 id="h-sch2">Upcoming payments</h2></div>
          <div class="st-row st-head" aria-hidden="true"><span>Date</span><span>Principal</span><span>Interest</span><span>Balance after</span></div>${sched}</section>`
          : `<section class="panel">${stateBlock({icon:'percent', title:'No active loans', text:'When you take out a loan, you’ll track it here.'})}</section>`}
      </div>
      <div class="stack">
        <section class="panel space loan-offer" aria-labelledby="h-pl"><div class="aurora" aria-hidden="true"></div>
          <p class="kicker" style="color:#8FE3F5">Personal loan</p><h2 id="h-pl" style="color:#fff;font-weight:400;font-size:24px;margin:0 0 6px">Borrow up to $50,000 from 8.9% APR</h2>
          <p style="color:#A9B8CE;margin:0 0 16px">Checking your rate won’t affect your credit score.</p>
          <div class="field"><label for="lc-amt" style="color:#C9D5E6">How much? <b class="amt" id="lc-amt-v" style="color:#fff">$10,000</b></label><input type="range" id="lc-amt" min="1000" max="50000" step="500" value="10000"></div>
          <div class="field"><label for="lc-term" style="color:#C9D5E6">Over</label><select class="input" id="lc-term">${[12, 24, 36, 48, 60].map(m => `<option value="${m}" ${m === 36 ? 'selected' : ''}>${m} months</option>`).join('')}</select></div>
          <p style="margin:0 0 16px;color:#C9D5E6">About <b class="amt" id="lc-pay" style="color:#fff;font-size:22px"></b> a month</p>
          <button class="btn primary block" data-act="loan-apply">Check my rate</button>
        </section>
        ${cc ? `<section class="panel" aria-labelledby="h-ccl"><div class="ph"><h2 id="h-ccl">${esc(cc.name)}</h2><button class="link" data-act="account:cc">Details</button></div>
          <dl class="sum"><dt>Balance</dt><dd class="amt">${money(-cc.bal, 'USD')}</dd><dt>Available credit</dt><dd class="amt">${money(avail(cc), 'USD')}</dd><dt>Payment due</dt><dd>${dateFmt.full.format(cc.due)}</dd></dl>
          <button class="btn block" data-act="pay-card">Pay credit card</button></section>` : ''}
      </div>
    </div>`;
  },

  statements(){
    const a = ACC(state.stAcct) || state.accounts[0]; state.stAcct = a.id;
    const months = Array.from({length:12}, (_, i) => monthStart(-1 - i));
    return `<div class="grid2">
      <section class="panel" aria-labelledby="h-st"><div class="ph"><h2 id="h-st">Statements</h2></div>
        <div class="field"><label for="st-acct">Account</label><select class="input" id="st-acct">${state.accounts.map(x => `<option value="${x.id}" ${x.id === a.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
        ${months.map((m, i) => `<div class="row ${i ? '' : 'first'}"><div><div class="nm">${new Intl.DateTimeFormat('en-GB', {month:'long', year:'numeric'}).format(m)}</div><div class="sub">Issued ${dateFmt.day.format(monthStart(-i))}</div></div><button class="btn small" data-act="stmt:${a.id}:${m}">${I.download} Download</button></div>`).join('')}
      </section>
      <div class="stack">
        <section class="panel" aria-labelledby="h-tax"><div class="ph"><h2 id="h-tax">Tax documents</h2></div>
          <div class="row first"><div><div class="nm">Form 1099-INT, 2025</div><div class="sub">Interest earned on savings</div></div><button class="btn small" data-act="taxdoc">${I.download} Download</button></div></section>
        <section class="panel" aria-labelledby="h-let"><div class="ph"><h2 id="h-let">Letters</h2></div>
          <div class="row first"><div><div class="nm">Account details letter</div><div class="sub">Proof of your account for an employer or landlord</div></div><button class="btn small" data-act="acct-letter:chk">${I.download} Download</button></div>
          <div class="row"><label for="sw-paper" style="cursor:pointer"><div class="nm">Paperless statements</div><div class="sub">We’ll email you when a new statement is ready.</div></label><input type="checkbox" role="switch" class="switch" id="sw-paper" data-set="paperless" ${state.paperless !== false ? 'checked' : ''}></div></section>
      </div></div>`;
  },

  security(){
    return `<div class="grid2">
      <div class="stack">
        <section class="panel" aria-labelledby="h-si"><div class="ph"><h2 id="h-si">Signing in</h2></div>
          <div class="row first"><div><div class="nm">Password</div><div class="sub">Changed 3 months ago</div></div><button class="btn small" data-act="pw">Change</button></div>
          <fieldset class="choices" style="grid-template-columns:1fr 1fr;margin-top:14px"><legend>Two-step verification</legend>
            ${[['app', 'Grat app'], ['sms', 'Text message']].map(([v, l]) => `<label class="choice"><input type="radio" name="twofa" value="${v}" data-set="twofa" ${state.twofa === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}</fieldset>
          <div class="row"><label for="sw-la" style="cursor:pointer"><div class="nm">Sign-in alerts</div><div class="sub">Get an email when a new device signs in.</div></label><input type="checkbox" role="switch" class="switch" id="sw-la" data-set="loginAlerts" ${state.loginAlerts ? 'checked' : ''}></div>
        </section>
        <section class="panel" aria-labelledby="h-pk"><div class="ph"><h2 id="h-pk">Passkeys</h2><button class="btn small" data-act="passkey-add">${I.plus} Add</button></div>
          ${state.passkeys.map(k => `<div class="row"><div><div class="nm">${esc(k.name)}</div><div class="sub">Added ${fmtDay(k.ts)}</div></div><button class="btn small danger" data-act="passkey-del:${k.id}" aria-label="Remove passkey ${esc(k.name)}">${I.trash}</button></div>`).join('')
            || stateBlock({icon:'key', title:'No passkeys yet', text:'Sign in with your face or fingerprint instead of a password.', actions:[['Add passkey','passkey-add',true]]})}</section>
      </div>
      <div class="stack">
        <section class="panel" aria-labelledby="h-dv"><div class="ph"><h2 id="h-dv">Devices</h2></div>
          ${state.devices.map(d => `<div class="row"><div><div class="nm">${esc(d.name)} ${d.current ? '<span class="tag ok">This device</span>' : ''}</div><div class="sub">${esc(d.place)}, ${d.current ? 'active now' : ago(d.ts).toLowerCase()}</div></div>${d.current ? '' : `<button class="btn small" data-act="dev-out:${d.id}">Sign out</button>`}</div>`).join('')}</section>
        <section class="panel" aria-labelledby="h-em"><div class="ph"><h2 id="h-em">Emergency</h2></div>
          <div class="row first"><div><div class="nm">${state.locked ? 'Account locked' : 'Lock your account'}</div><div class="sub">Stops all payments, transfers and cards straight away.</div></div>${state.locked ? '<button class="btn small primary" data-act="unlock">Unlock</button>' : '<button class="btn small danger" data-act="lock">Lock</button>'}</div>
          <div class="row"><div><div class="nm">Report fraud</div><div class="sub">Tell us about a payment or message you don’t trust.</div></div><button class="btn small" data-act="fraud">Report</button></div>
          <div class="row"><div><div class="nm">Anti-phishing code</div><div class="sub">${state.antiPhish ? `Your code: ${esc(state.antiPhish)}` : 'Shown in every real email from us'}</div></div><button class="btn small" data-act="phish">${state.antiPhish ? 'Change' : 'Set up'}</button></div>
        </section>
      </div></div>`;
  },

  settings(){
    const p = state.profile;
    const nsw = (k, l, s) => `<div class="row"><label for="ns-${k}" style="cursor:pointer"><div class="nm">${l}</div><div class="sub">${s}</div></label><input type="checkbox" role="switch" class="switch" id="ns-${k}" data-set="notif:${k}" ${state.notif[k] ? 'checked' : ''}></div>`;
    return `<div class="grid2">
      <div class="stack">
        <section class="panel" aria-labelledby="h-pr"><div class="ph"><h2 id="h-pr">Profile</h2><button class="btn small" data-act="profile">${I.edit} Edit</button></div>
          <div class="prof-head"><div class="prof-av">${userAvatar(72)}<button class="prof-cam" data-act="photo" aria-label="Change profile photo">${I.camera}</button></div><div style="min-width:0"><div class="nm" style="font-size:18px">${esc(p.first)} ${esc(p.last)}</div><div class="sub">Personal account</div><button class="link" data-act="photo" style="margin-top:4px">Change photo</button></div></div>
          <dl class="sum"><dt>Name</dt><dd>${esc(p.first)} ${esc(p.last)}</dd><dt>Email</dt><dd>${esc(p.email)}</dd><dt>Phone</dt><dd>${esc(p.phone)}</dd><dt>Address</dt><dd>${esc(p.address)}</dd><dt>Customer since</dt><dd>${dateFmt.full.format(p.since)}</dd></dl></section>
        <section class="panel" aria-labelledby="h-dc"><div class="ph"><h2 id="h-dc">Display currency</h2></div>
          <p class="sub" style="margin:0 0 10px">Totals across accounts are shown in this currency.</p>
          <fieldset class="choices" style="grid-template-columns:repeat(3,1fr)"><legend class="sr-only">Display currency</legend>${CUR_LIST.map(c => `<label class="choice"><input type="radio" name="cur" value="${c}" data-set="cur" ${state.cur === c ? 'checked' : ''}><span>${c}</span></label>`).join('')}</fieldset></section>
        <section class="panel" aria-labelledby="h-nt"><div class="ph"><h2 id="h-nt">Notifications</h2></div>
          ${nsw('payments', 'Money in and out', 'Every payment, transfer and deposit')}${nsw('card', 'Card payments', 'Each time your card is used')}${nsw('low', 'Low balance', `When checking drops below ${money(state.lowBal, 'USD', {dec:0})}`)}${nsw('bills', 'Bill reminders', 'Three days before a bill is due')}${nsw('security', 'Security', 'Sign-ins and changes to your account')}${nsw('marketing', 'News and offers', 'Occasional product updates')}
        </section>

          ${moneyField('tf-amt', f.cur, w.val, w)}

          <div class="field"><label for="in-pur">Reason for payment</label><select class="input" id="in-pur" ${inv(w, 'purpose')}><option value="">Choose a reason</option>${['Family support', 'Paying for goods or services', 'Rent or property', 'Education', 'Travel', 'Gift'].map(x => `<option ${w.purpose === x ? 'selected' : ''}>${x}</option>`).join('')}</select>${E(w, 'purpose') || '<p class="hint">Banks abroad ask for this by law.</p>'}</div>
          <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Review</button></div></form>`;
        const read = () => { w.to = $('#in-to').value; w.from = $('#in-from').value; w.val = $('#in-amt').value; w.purpose = $('#in-pur').value; };
        $('#in-to').onchange = $('#in-from').onchange = () => { const id = document.activeElement.id; read(); w.errors = {}; draw(); $('#' + id)?.focus(); };
        $('#in-amt').oninput = () => { w.val = $('#in-amt').value; const c2 = calc(); $('#in-got').textContent = c2.v > 0 ? money(c2.got, c2.p.cur, {force:true}) : '—'; };
        $('#in-new').onclick = () => openPayeeAdd({kind:'intl', then:'intl'});
        $('#inf').onsubmit = e => {
          e.preventDefault(); read(); w.errors = {}; const c2 = calc();
          if (!(c2.v > 0)) w.errors.amt = 'Enter an amount.';
          else if (toUsd(c2.v, c2.f.cur) < 10) w.errors.amt = `The smallest international transfer is ${money(convert(10, 'USD', c2.f.cur), c2.f.cur, {force:true})}.`;
          else if (c2.total > avail(c2.f) + 1e-9) w.errors.amt = `With the ${money(c2.fee, c2.f.cur, {force:true})} fee, that’s more than you have. ${fundsMsg(c2.f)}`;
          if (!w.purpose) w.errors.purpose = 'Choose a reason for this payment.';
          if (Object.keys(w.errors).length){ draw(); focusInvalid(m); return; }
          w.step = 2; draw(); m.focusFirst();
        };
      } else if (w.step === 2){
        m.setTitle('Check your transfer');
        const c = calc();
        m.body.innerHTML = stepsBar(2, 4) + quoteBar() + `<p class="hint">${esc(c.p.name)} gets</p><p class="big-amt" id="in-big">${money(c.got, c.p.cur, {force:true})}</p>
          <dl class="sum"><dt>You send</dt><dd>${money(c.v, c.f.cur, {force:true})}</dd><dt>Fee</dt><dd>${money(c.fee, c.f.cur, {force:true})}</dd><dt>Total taken</dt><dd><b>${money(c.total, c.f.cur, {force:true})}</b></dd><dt>Rate</dt><dd id="in-rate">1 ${c.f.cur} = ${rateF(fxRate(c.f.cur, c.p.cur))} ${c.p.cur}</dd><dt>To</dt><dd>${esc(c.p.bank)}<br><span class="sub">${esc(c.p.acct)}</span></dd><dt>Reason</dt><dd>${esc(w.purpose)}</dd></dl>
          <div class="actions split"><button class="btn" id="in-back">Edit</button><button class="btn primary" id="in-go" data-autofocus>Continue</button></div>`;
        quoteTimer(m, w, () => { const c2 = calc(); $('#in-big').textContent = money(c2.got, c2.p.cur, {force:true}); $('#in-rate').textContent = `1 ${c2.f.cur} = ${rateF(fxRate(c2.f.cur, c2.p.cur))} ${c2.p.cur}`; });
        $('#in-back').onclick = () => { w.step = 1; draw(); m.focusFirst(); };
        $('#in-go').onclick = () => { w.locked = calc(); w.step = 3; draw(); m.focusFirst(); };
      } else if (w.step === 3){
        const c = w.locked;
        codeStep(m, w, {title:'Approve transfer', lead:`Approve sending ${money(c.got, c.p.cur, {force:true})} to ${esc(c.p.name)}.`,
          onBack: () => { w.errors = {}; w.step = 2; draw(); m.focusFirst(); },
          onOk: () => {
            m.body.innerHTML = spinStep('Sending your transfer…');
            m.later(() => {
              if (state.demo.failPay){ state.demo.failPay = false; w.step = 9; draw(); m.focusFirst(); return; }
              c.f.bal = round(c.f.bal - c.total, 2);
              addTx(c.f.id, -c.v, `${c.p.name}, ${c.p.country}`, 'transfers', 'intl', {status:'pending', settleAt: Date.now() + 60e3, memo: w.purpose});
              addTx(c.f.id, -c.fee, 'International transfer fee', 'fees', 'fee');
              w.step = 4; render(); draw(); m.focusFirst();
            }, 1100);
          }});
      } else if (w.step === 4){
        const c = w.locked;
        m.setTitle('Transfer on its way');
        m.body.innerHTML = stepsBar(4, 4) + doneBlock({pending:true, big: money(c.got, c.p.cur, {force:true}), sub:`We’ll let you know when ${esc(c.p.name)} receives it. ${'Usually within 1 to 2 working days.'}`}) +
          `<ol class="track" aria-label="Transfer progress"><li class="on">Sent from Grat</li><li class="on">Converted to ${c.p.cur}</li><li>Received by ${esc(c.p.bank)}</li><li>In ${esc(c.p.name.split(' ')[0])}’s account</li></ol>
          <div class="actions split"><button class="btn primary" data-close data-autofocus>Done</button></div>`;
      } else {
        m.setTitle('Transfer didn’t go through');
        m.body.innerHTML = failStep('We couldn’t send this transfer', 'The receiving bank rejected the details. Nothing has left your account. Check the account number or try again later.');
        $('#f-retry').onclick = () => { w.step = 1; draw(); m.focusFirst(); };
      }
    };
    draw();
  }});
}

/* ================= Currency exchange ================= */
function openExchange(cur){
  if (guardNet(true) || guardLocked()) return;
  const accts = fromAccts();
  let to = cur && cur !== 'USD' ? accts.find(a => a.cur === cur)?.id : accts.find(a => a.type === 'currency')?.id;
  if (cur && cur !== 'USD' && !to){ confirmBox({title:`Open a ${CURS[cur].name} account?`, text:`You don’t have a ${cur} account yet. It’s free to open and ready straight away.`, ok:'Open account', onOk(){ openAccount({type:'currency', cur}); }}); return; }
  const w = {from: to === 'chk' ? 'eur' : 'chk', to: to || 'eur', val:'', step:1, errors:{}};
  openModal({title:'Exchange money', render(m){
    const calc = () => { const f = ACC(w.from), t = ACC(w.to), v = parseNum(w.val) || 0; return {f, t, v, got: convert(v, f.cur, t.cur) * .9965}; };
    const draw = () => {
      if (w.step === 1){
        m.setTitle('Exchange money');
        if (w.to === w.from) w.to = accts.find(a => a.id !== w.from).id;
        const c = calc();
        m.body.innerHTML = stepsBar(1, 3) + `<form id="xf" novalidate>
          <div class="field"><label for="x-from">From</label><select class="input" id="x-from">${acctOptions(accts, w.from)}</select></div>
          ${moneyField('x-amt', c.f.cur, w.val, w, 'amt', 'You exchange')}
          <button type="button" class="swap-btn" id="x-sw" aria-label="Swap currencies">${I.swap}</button>
          <div class="field"><label for="x-to">Into</label><select class="input" id="x-to">${accts.filter(a => a.id !== w.from).map(a => `<option value="${a.id}" ${a.id === w.to ? 'selected' : ''}>${esc(a.name)} (${a.cur})</option>`).join('')}</select></div>
          <div class="fx-quote"><div><span class="sub">You get</span><b class="amt" id="x-got">${c.v > 0 ? money(c.got, c.t.cur, {force:true}) : '—'}</b></div><div><span class="sub">Rate</span><b>1 ${c.f.cur} = <span data-live="fxpair:${c.f.cur}-${c.t.cur}">${rateF(fxRate(c.f.cur, c.t.cur))}</span> ${c.t.cur}</b></div><div><span class="sub">Fee</span><b>0.35%</b></div></div>
          ${c.f.cur === c.t.cur ? '<p class="info-box">These accounts use the same currency. Use Transfer instead to move money for free.</p>' : ''}
          <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit" ${c.f.cur === c.t.cur ? 'disabled' : ''}>Get quote</button></div></form>`;
        const read = () => { w.from = $('#x-from').value; w.to = $('#x-to').value; w.val = $('#x-amt').value; };
        $('#x-from').onchange = () => { read(); w.errors = {}; draw(); $('#x-from').focus(); };
        $('#x-to').onchange = () => { read(); draw(); $('#x-to').focus(); };
        $('#x-sw').onclick = () => { read(); [w.from, w.to] = [w.to, w.from]; draw(); $('#x-sw').focus(); };
        $('#x-amt').oninput = () => { w.val = $('#x-amt').value; const c2 = calc(); $('#x-got').textContent = c2.v > 0 ? money(c2.got, c2.t.cur, {force:true}) : '—'; };
        $('#xf').onsubmit = e => {
          e.preventDefault(); read(); w.errors = {}; const c2 = calc();
          if (!(c2.v > 0)) w.errors.amt = 'Enter an amount.';
          else if (c2.v > avail(c2.f) + 1e-9) w.errors.amt = `That’s more than you have. ${fundsMsg(c2.f)}`;
          else if (toUsd(c2.v, c2.f.cur) < 1) w.errors.amt = 'Exchange at least the equivalent of $1.';
          if (Object.keys(w.errors).length){ draw(); focusInvalid(m); return; }
          w.step = 2; draw(); m.focusFirst();
        };
      } else if (w.step === 2){
        const c = calc();
        m.setTitle('Your quote');
        m.body.innerHTML = stepsBar(2, 3) + quoteBar() + `<p class="hint">You get</p><p class="big-amt" id="x-big">${money(c.got, c.t.cur, {force:true})}</p>
          <dl class="sum"><dt>You exchange</dt><dd>${money(c.v, c.f.cur, {force:true})}</dd><dt>Rate</dt><dd id="x-rate">1 ${c.f.cur} = ${rateF(fxRate(c.f.cur, c.t.cur))} ${c.t.cur}</dd><dt>Fee</dt><dd>${money(c.v * .0035, c.f.cur, {force:true})} (0.35%)</dd><dt>Into</dt><dd>${esc(c.t.name)}</dd></dl>
          <div class="actions split"><button class="btn" id="x-back">Edit</button><button class="btn primary" id="x-go" data-autofocus>Exchange now</button></div>`;
        quoteTimer(m, w, () => { const c2 = calc(); $('#x-big').textContent = money(c2.got, c2.t.cur, {force:true}); $('#x-rate').textContent = `1 ${c2.f.cur} = ${rateF(fxRate(c2.f.cur, c2.t.cur))} ${c2.t.cur}`; });
        $('#x-back').onclick = () => { w.step = 1; draw(); m.focusFirst(); };
        $('#x-go').onclick = () => {
          const c2 = calc(); w.done = c2;
          c2.f.bal = round(c2.f.bal - c2.v); c2.t.bal = round(c2.t.bal + c2.got);
          addTx(c2.f.id, -c2.v, `Exchanged to ${c2.t.cur}`, 'transfers', 'fx'); addTx(c2.t.id, c2.got, `Exchanged from ${c2.f.cur}`, 'transfers', 'fx');
          w.step = 3; render(); draw(); m.focusFirst();
        };
      } else {
        const c = w.done;
        m.setTitle('Exchange complete');
        m.body.innerHTML = stepsBar(3, 3) + doneBlock({big: money(c.got, c.t.cur, {force:true}), sub:`Now in your ${esc(c.t.name)}.`}) + `<div class="actions split"><button class="btn" id="x-again">Exchange more</button><button class="btn primary" data-close data-autofocus>Done</button></div>`;
        $('#x-again').onclick = () => { Object.assign(w, {val:'', step:1, errors:{}}); draw(); m.focusFirst(); };
      }
    };
    draw();
  }});
}

  ? `<svg viewBox="0 0 320 140" class="check-art" aria-hidden="true"><rect x="1" y="1" width="318" height="138" rx="8" fill="#F4F1E6" stroke="#CFC7A8"/><text x="16" y="26" font-size="11" fill="#6B6450" font-family="sans-serif">PARKVIEW HOLDINGS LLC</text><text x="250" y="26" font-size="11" fill="#6B6450" font-family="sans-serif">No. 1042</text><text x="16" y="60" font-size="10" fill="#6B6450" font-family="sans-serif">PAY TO THE ORDER OF</text><path d="M130 60h170" stroke="#9C9478"/><text x="136" y="56" font-size="13" fill="#20305A" font-family="cursive">Anna Meier</text><rect x="236" y="70" width="70" height="20" fill="none" stroke="#9C9478"/><text x="242" y="85" font-size="12" fill="#20305A" font-family="sans-serif">$ 250.00</text><path d="M16 110h120M190 110h110" stroke="#9C9478"/><text x="16" y="130" font-size="11" fill="#6B6450" font-family="monospace">⑆021000089⑆ 4400182⑈ 1042</text></svg>`
  : `<svg viewBox="0 0 320 140" class="check-art" aria-hidden="true"><rect x="1" y="1" width="318" height="138" rx="8" fill="#F4F1E6" stroke="#CFC7A8"/><rect x="200" y="12" width="108" height="116" fill="none" stroke="#CFC7A8" stroke-dasharray="4 3"/><text x="206" y="28" font-size="9" fill="#6B6450" font-family="sans-serif">ENDORSE HERE</text><text x="206" y="58" font-size="12" fill="#20305A" font-family="cursive">Anna Meier</text><text x="206" y="80" font-size="8" fill="#20305A" font-family="sans-serif">For mobile deposit</text><text x="206" y="92" font-size="8" fill="#20305A" font-family="sans-serif">at Grat only</text></svg>`;
function openCheck(){
  if (guardNet() || guardLocked()) return;
  const w = {step:1, front:false, back:false, to:'chk', val:'', ok:false, errors:{}};
  openModal({title:'Deposit a check', render(m){
    const draw = () => {
      if (w.step <= 2){
        const side = w.step === 1 ? 'front' : 'back';
        m.setTitle(`Photo of the ${side}`);
        m.body.innerHTML = stepsBar(w.step, 4) + `<div class="cam check-cam" id="cam"><div class="check-frame">${w[side] ? CHECK_SVG(side) : ''}</div><span class="count" id="cam-n" aria-live="assertive"></span></div>
          <p class="hint" style="margin-bottom:14px">${side === 'front' ? 'Place the check on a dark surface with all four corners in the frame.' : 'Sign the back and write “For mobile deposit at Grat only”.'}</p>
          ${w[side] ? `<p class="info-box" style="display:flex;gap:8px">${I.check}<span>Looks good. The image is sharp and all corners are visible.</span></p>` : ''}
          <div class="actions split"><button class="btn" id="ck-back">${w.step === 1 ? 'Cancel' : 'Back'}</button><button class="btn primary" id="ck-go" data-autofocus>${w[side] ? 'Continue' : `Take photo`}</button></div>`;
        $('#ck-back').onclick = () => { if (w.step === 1) closeModal(); else { w.step = 1; draw(); m.focusFirst(); } };
        $('#ck-go').onclick = () => {
          if (w[side]){ w.step++; draw(); m.focusFirst(); return; }
          $('#ck-go').disabled = true; let n = 3; $('#cam-n').textContent = n;
          const iv = m.every(() => { n--; if (n > 0){ $('#cam-n').textContent = n; return; } clearInterval(iv); w[side] = true; draw(); m.focusFirst(); }, 600);
        };
      } else if (w.step === 3){
        m.setTitle('Deposit details');
        m.body.innerHTML = stepsBar(3, 4) + `<form id="ckf" novalidate>
          ${moneyField('ck-amt', 'USD', w.val, w, 'amt', 'Check amount')}
          <div class="field"><label for="ck-to">Deposit to</label><select class="input" id="ck-to">${acctOptions(fromAccts().filter(a => a.cur === 'USD'), w.to)}</select></div>
          <label class="check"><input type="checkbox" id="ck-ok" ${w.ok ? 'checked' : ''} ${inv(w, 'ok')}> I’ve endorsed the check and will keep it for 14 days</label>${E(w, 'ok')}
          <p class="hint">Daily limit ${money(5000, 'USD', {force:true, dec:0})}. Funds are usually available the next working day.</p>
          <div class="actions"><button type="button" class="btn" id="ck-b2">Back</button><button class="btn primary" type="submit">Deposit check</button></div></form>`;
        $('#ck-b2').onclick = () => { w.step = 2; draw(); m.focusFirst(); };
        $('#ckf').onsubmit = e => {
          e.preventDefault(); w.val = $('#ck-amt').value; w.to = $('#ck-to').value; w.ok = $('#ck-ok').checked; w.errors = {};
          const v = parseNum(w.val);
          if (!(v > 0)) w.errors.amt = 'Enter the amount written on the check.';
          else if (v > 5000) w.errors.amt = `Checks over ${money(5000, 'USD', {force:true, dec:0})} need to be deposited at a branch or ATM.`;
          if (!w.ok) w.errors.ok = 'Please confirm you’ve endorsed the check.';
          if (Object.keys(w.errors).length){ draw(); focusInvalid(m); return; }
          w.amt = v; m.body.innerHTML = spinStep('Reading your check…');
          m.later(() => {
            if (Math.abs(w.amt - 250) > .001 && !w.warned){ w.warned = true; w.step = 5; draw(); m.focusFirst(); return; }
            finish();
          }, 1400);
        };
      } else if (w.step === 5){
        m.setTitle('Check the amount');
        m.body.innerHTML = `<div class="banner warn" style="align-items:flex-start">${icSize('alertTri', 20)}<span>The amount you entered, <b>${money(w.amt, 'USD', {force:true})}</b>, doesn’t match the ${money(250, 'USD', {force:true})} we read on the check. Mismatched amounts delay your deposit.</span></div>
          <div class="actions split"><button class="btn" id="ck-keep">Keep ${money(w.amt, 'USD', {force:true})}</button><button class="btn primary" id="ck-fix" data-autofocus>Use ${money(250, 'USD', {force:true})}</button></div>`;
        $('#ck-fix').onclick = () => { w.amt = 250; finish(); };
        $('#ck-keep').onclick = finish;
      } else {
        m.setTitle('Check received');
        m.body.innerHTML = stepsBar(4, 4) + doneBlock({pending:true, big: money(w.amt, 'USD', {force:true}), sub:`We’re reviewing your check. It should be in ${esc(ACC(w.to).name)} by ${dateFmt.day.format(startOfDay(Date.now()) + (new Date().getDay() >= 5 ? 3 : 1) * DAY)}.`}) + `<div class="actions split"><button class="btn primary" data-close data-autofocus>Done</button></div>`;
      }
    };
    const finish = () => { addTx(w.to, w.amt, 'Mobile check deposit', 'income', 'check', {status:'pending', settleAt: Date.now() + 90e3}); ACC(w.to).bal = round(ACC(w.to).bal + w.amt); w.step = 4; render(); draw(); m.focusFirst(); };
    draw();
  }});
}

            if (w.method === 'card'){ a.bal = round(a.bal + w.amt); addTx(a.id, w.amt, 'Card top-up', 'transfers', 'topup'); }
            else addTx(a.id, w.amt, 'From First Coast Bank', 'transfers', 'topup', {status:'pending', settleAt: Date.now() + 120e3});
            w.step = 3; render(); draw(); m.focusFirst();
          }, 1300);
        };
      } else if (w.step === 3){
        m.setTitle(w.method === 'card' ? 'Money added' : 'Transfer requested');
        m.body.innerHTML = stepsBar(3, 3) + doneBlock({pending: w.method === 'bank', big: money(w.amt, 'USD', {force:true}), sub: w.method === 'card' ? `Now in ${esc(ACC(w.to).name)}.` : `We’ll add it to ${esc(ACC(w.to).name)} as soon as it arrives, usually within 1 to 3 working days.`}) + `<div class="actions split"><button class="btn primary" data-close data-autofocus>Done</button></div>`;
      } else {
        m.setTitle('Card declined');
        m.body.innerHTML = failBlock('Your card was declined', 'Your bank didn’t approve this payment, so nothing was charged. Try another card, or use your linked bank account for free.') +
          `<div class="actions split"><button class="btn" id="am-bank">Use bank account</button><button class="btn primary" id="am-again" data-autofocus>Try again</button></div>`;
        $('#am-bank').onclick = () => { w.method = 'bank'; w.step = 1; w.errors = {}; draw(); m.focusFirst(); };
        $('#am-again').onclick = () => { w.step = 1; w.errors = {}; draw(); m.focusFirst(); };
      }
    };
    draw();
  }});
}

function openPayBill(id){

  const unpaid = state.bills.filter(b => !b.paid);
  if (!unpaid.length){ openModal({title:'Pay a bill', render(m){ m.body.innerHTML = stateBlock({icon:'receipt', title:'All bills are paid', text:'Nothing is due right now. Add a biller to pay someone new.'}) + `<div class="actions split"><button class="btn" data-close>Close</button><button class="btn primary" id="pb-add" data-autofocus>Add biller</button></div>`; $('#pb-add').onclick = () => openBillerAdd(); }}); return; }
  const w = {id: id && unpaid.some(b => b.id === id) ? id : unpaid[0].id, from:'chk', val:'', step:1, errors:{}};
  w.val = String(state.bills.find(b => b.id === w.id).amt);
  openModal({title:'Pay a bill', render(m){
    const draw = () => {
      const b = state.bills.find(x => x.id === w.id), f = ACC(w.from);

        m.body.innerHTML = stepsBar(1, 3) + `<form id="pbf" novalidate>

          ${moneyField('pb-amt', 'USD', w.val, w)}

          <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Review</button></div></form>`;
        $('#pb-b').onchange = () => { w.id = $('#pb-b').value; w.val = String(state.bills.find(x => x.id === w.id).amt); w.errors = {}; draw(); $('#pb-b').focus(); };
        $('#pbf').onsubmit = e => {

          w.amt = v; w.step = 2; draw(); m.focusFirst();

        m.setTitle('Check your payment');

          <div class="actions split"><button class="btn" id="pb-back">Edit</button><button class="btn primary" id="pb-go" data-autofocus>Pay bill</button></div>`;
        $('#pb-back').onclick = () => { w.step = 1; draw(); m.focusFirst(); };
        $('#pb-go').onclick = () => {
          m.body.innerHTML = spinStep('Paying your bill…');
          m.later(() => {
            if (state.demo.failPay){ state.demo.failPay = false; w.step = 9; draw(); m.focusFirst(); return; }
            f.bal = round(f.bal - w.amt); b.paid = true; addTx(f.id, -w.amt, b.name, 'bills', 'bill'); w.step = 3; render(); draw(); m.focusFirst();
          }, 900);
        };
      } else if (w.step === 3){
        m.setTitle('Bill paid');

      } else {
        m.setTitle('Bill payment failed');

        $('#f-retry').onclick = () => { w.step = 2; draw(); m.focusFirst(); };
      }
    };
    draw();
  }});

const INTL_RULES = {
  Germany:{cur:'EUR', label:'IBAN', rx:/^DE\d{2}\s?(\d{4}\s?){4}\d{2}$/i, ph:'DE89 3704 0044 0532 0130 00', hint:'German IBANs start with DE and have 22 characters.'},
  France:{cur:'EUR', label:'IBAN', rx:/^FR\d{2}(\s?\w{4}){5}\s?\w{3}$/i, ph:'FR76 3000 6000 0112 3456 7890 189', hint:'French IBANs start with FR and have 27 characters.'},
  'United Kingdom':{cur:'GBP', label:'Sort code and account number', rx:/^\d{2}-?\d{2}-?\d{2}\s+\d{8}$/, ph:'20-00-00 55779911', hint:'6-digit sort code, a space, then the 8-digit account number.'},
  Japan:{cur:'JPY', label:'Branch code and account number', rx:/^\d{3}-?\d{7}$/, ph:'123-4567890', hint:'3-digit branch code, then the 7-digit account number.'},
  Canada:{cur:'CAD', label:'Transit, institution and account', rx:/^\d{5}-\d{3}-\d{7,12}$/, ph:'12345-003-1234567', hint:'Transit (5), institution (3) and account number, separated by dashes.'},
  Switzerland:{cur:'CHF', label:'IBAN', rx:/^CH\d{2}(\s?\w{4}){4}\s?\w$/i, ph:'CH93 0076 2011 6238 5295 7', hint:'Swiss IBANs start with CH and have 21 characters.'}
};

            : `<div class="field"><label for="pa-ct">Country</label><select class="input" id="pa-ct">${Object.keys(INTL_RULES).map(c => `<option ${c === w.country ? 'selected' : ''}>${c}</option>`).join('')}</select><p class="hint">They’ll receive ${CURS[r.cur].name}s (${r.cur}).</p></div>

          } else {

          + `<dl class="sum"><dt>Name</dt><dd>${esc(w.name.trim())}</dd><dt>${w.kind === 'domestic' ? 'Routing' : 'Bank'}</dt><dd>${esc(w.kind === 'domestic' ? w.routing : w.bank)}</dd><dt>Account</dt><dd class="mono">${esc(w.acct)}</dd>${w.kind === 'intl' ? `<dt>Currency</dt><dd>${INTL_RULES[w.country].cur}</dd>` : ''}</dl>
          <div class="actions split"><button class="btn" id="pa-back">Edit</button><button class="btn primary" id="pa-go" data-autofocus>${w.match ? 'Continue' : 'Save anyway'}</button></div>`;
        $('#pa-back').onclick = () => { w.step = 1; draw(); m.focusFirst(); };
        $('#pa-go').onclick = () => { w.step = 3; draw(); m.focusFirst(); };
      } else if (w.step === 3){
        codeStep(m, w, {title:'Approve new payee', lead:`Approve adding ${esc(w.name.trim())} as a payee.`,
          onBack: () => { w.errors = {}; w.step = 2; draw(); m.focusFirst(); },
          onOk: () => {
            const acct = w.acct.trim(), p = w.kind === 'domestic'
              ? {id:nid('p'), name:w.name.trim(), nick:w.nick.trim(), kind:'domestic', bank:'Routing ' + w.routing, acct:'••' + acct.slice(-4), cur:'USD'}
              : {id:nid('p'), name:w.name.trim(), kind:'intl', bank:w.bank.trim(), acct: acct.length > 8 ? acct.slice(0, 4) + ' •••• ' + acct.slice(-4) : '••' + acct.slice(-4), cur:INTL_RULES[w.country].cur, country:w.country};
            state.payees.push(p); if (state.route.view === 'payments') render(); toast(`${p.name} saved as a payee`);
            if (then === 'pay') openPay({to:p.id}); else if (then === 'intl') openIntl({to:p.id}); else closeModal();
          }});
      }
    };
    draw();
  }});
}

/* ================= Credit card & loan payments ================= */
function openPayCard(){
  if (guardNet() || guardLocked()) return;
  const cc = ACC('cc');
  if (!cc || cc.bal >= 0){ toast('Your credit card is fully paid off'); return; }
  const w = {opt:'stmt', val:'', from:'chk', step:1, errors:{}};
  openModal({title:'Pay credit card', render(m){
    const opts = {min:['Minimum payment', cc.minDue], stmt:['Statement balance', cc.stmt], cur:['Current balance', -cc.bal], other:['Other amount', null]};
    const draw = () => {
      if (w.step === 1){
        m.body.innerHTML = `<form id="pcf" novalidate><fieldset class="choices" style="grid-template-columns:1fr"><legend>How much?</legend>${Object.entries(opts).map(([k, [l, v]]) => `<label class="choice"><input type="radio" name="pco" value="${k}" ${w.opt === k ? 'checked' : ''}><span style="display:flex;justify-content:space-between;padding:10px 12px;text-align:left"><span>${l}</span><b class="amt">${v != null ? money(v, 'USD', {force:true}) : ''}</b></span></label>`).join('')}</fieldset>
          ${w.opt === 'other' ? moneyField('pc-amt', 'USD', w.val, w) : ''}
          <div class="field"><label for="pc-from">From</label><select class="input" id="pc-from">${acctOptions(fromAccts().filter(a => a.cur === 'USD'), w.from)}</select></div>
          <p class="hint">Due ${dateFmt.full.format(cc.due)}. Paying the statement balance in full means no interest.</p>
          <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Pay now</button></div></form>`;
        $$('input[name=pco]', m.body).forEach(r => r.onchange = () => { w.opt = r.value; w.from = $('#pc-from').value; draw(); $(`input[name=pco][value=${w.opt}]`, m.body).focus(); });
        $('#pcf').onsubmit = e => {
          e.preventDefault(); w.from = $('#pc-from').value; w.errors = {};
          const v = w.opt === 'other' ? parseNum(w.val = $('#pc-amt').value) : opts[w.opt][1], a = ACC(w.from);
          if (!(v > 0)) w.errors.amt = 'Enter an amount.';
          else if (v > -cc.bal + 1e-9) w.errors.amt = `Your balance is ${money(-cc.bal, 'USD', {force:true})}. You can’t pay more than that.`;
          else if (v > avail(a) + 1e-9) w.errors.amt = `That’s more than you have. ${fundsMsg(a)}`;
          if (Object.keys(w.errors).length){ if (w.opt !== 'other'){ w.opt = 'other'; w.val = String(v); } draw(); focusInvalid(m); return; }
          a.bal = round(a.bal - v); cc.bal = round(cc.bal + v); cc.stmt = Math.max(0, round(cc.stmt - v)); cc.minDue = cc.stmt > 0 ? cc.minDue : 0;
          addTx(a.id, -v, 'Rewards Credit Card payment', 'transfers', 'transfer'); addTx('cc', v, 'Payment, thank you', 'transfers', 'transfer');
          w.amt = v; w.step = 2; render(); draw(); m.focusFirst();
        };
      } else {
        m.setTitle('Payment made');
        m.body.innerHTML = doneBlock({big: money(w.amt, 'USD', {force:true}), sub:`Paid to your Rewards Credit Card. New balance ${money(-cc.bal, 'USD', {force:true})}.`}) + `<div class="actions split"><button class="btn primary" data-close data-autofocus>Done</button></div>`;
      }
    };
    draw();
  }});
}

function openGoalMove(id, dir){
  if (guardNet() || guardLocked()) return;
  const g = state.goals.find(x => x.id === id), w = {val:'', acct:'chk', errors:{}};
  openModal({title: dir === 'in' ? `Add to ${g.name}` : `Withdraw from ${g.name}`, render(m){
    const draw = () => {
      const a = ACC(w.acct);
      m.body.innerHTML = `<form id="gmf" novalidate>${moneyField('gm-amt', 'USD', w.val, w)}
        <p class="hint" style="margin:-8px 0 14px">${dir === 'in' ? fundsMsg(a) : `${money(g.saved, 'USD', {force:true})} in this goal.`}</p>
        <div class="field"><label for="gm-a">${dir === 'in' ? 'From' : 'To'}</label><select class="input" id="gm-a">${acctOptions(fromAccts().filter(x => x.cur === 'USD'), w.acct)}</select></div>
        ${dir === 'in' ? `<div class="chips" role="group" aria-label="Quick amounts">${[25, 50, 100, 250].map(v => `<button type="button" class="chip" data-q="${v}">${money(v, 'USD', {force:true, dec:0})}</button>`).join('')}</div>` : ''}
        <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">${dir === 'in' ? 'Add money' : 'Withdraw'}</button></div></form>`;
      $$('[data-q]', m.body).forEach(b => b.onclick = () => { $('#gm-amt').value = b.dataset.q; $('#gm-amt').focus(); });
      $('#gm-a').onchange = () => { w.val = $('#gm-amt').value; w.acct = $('#gm-a').value; draw(); $('#gm-a').focus(); };
      $('#gmf').onsubmit = e => { e.preventDefault(); w.val = $('#gm-amt').value; w.acct = $('#gm-a').value; w.errors = {};
        const v = parseNum(w.val), acc = ACC(w.acct);
        if (!(v > 0)) w.errors.amt = 'Enter an amount.';
        else if (dir === 'in' && v > avail(acc) + 1e-9) w.errors.amt = `That’s more than you have. ${fundsMsg(acc)}`;
        else if (dir === 'out' && v > g.saved + 1e-9) w.errors.amt = `You have ${money(g.saved, 'USD', {force:true})} in this goal.`;
        if (Object.keys(w.errors).length){ draw(); focusInvalid(m); return; }
        if (dir === 'in'){ acc.bal = round(acc.bal - v); g.saved = round(g.saved + v); addTx(acc.id, -v, `To goal: ${g.name}`, 'savings', 'goal'); }
        else { acc.bal = round(acc.bal + v); g.saved = round(g.saved - v); addTx(acc.id, v, `From goal: ${g.name}`, 'savings', 'goal'); }
        closeModal(); render();
        if (dir === 'in' && g.saved >= g.target) notify(`You reached your ${g.name} goal. Congratulations!`); else toast(dir === 'in' ? `${money(v, 'USD', {force:true})} added to ${g.name}` : `${money(v, 'USD', {force:true})} moved to ${acc.name}`); };
    };
    draw();
  }});
}

const docShell = (title, body) => `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${title}</title><style>body{font:14px/1.5 system-ui,sans-serif;color:#162033;max-width:760px;margin:40px auto;padding:0 24px}h1{font-weight:500;letter-spacing:-.02em}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:8px 6px;border-bottom:1px solid #D9E1EB;text-align:left}td:last-child,th:last-child{text-align:right}.muted{color:#5B6879}.brand{display:flex;gap:8px;align-items:center;font-weight:600;font-size:18px}</style></head><body><div class="brand">${LOGO('#2B47F5', '#8FCBDB', 22)} Grat</div>${body}<p class="muted" style="margin-top:40px">Grat is a fictional bank. This is a prototype document and does not represent real money or a real account.</p></body></html>`;
function downloadStatement(id, from){
  const a = ACC(id), to = (() => { const d = new Date(from); d.setMonth(d.getMonth() + 1); return d.getTime(); })();
  const rows = state.txns.filter(t => t.acct === id && t.ts >= from && t.ts < to).sort((x, y) => x.ts - y.ts);
  const label = new Intl.DateTimeFormat('en-GB', {month:'long', year:'numeric'}).format(from);
  download(`grat-statement-${a.id}-${toDateInput(from).slice(0, 7)}.html`, docShell(`Statement ${label}`, `<h1>${esc(a.name)} statement</h1><p class="muted">${label}<br>${esc(state.profile.first)} ${esc(state.profile.last)}, ${esc(state.profile.address)}<br>Account ${esc(a.num || a.iban || '')}</p>
    <table><thead><tr><th>Date</th><th>Description</th><th>Amount (${a.cur})</th></tr></thead><tbody>${rows.map(t => `<tr><td>${dateFmt.short.format(t.ts)}</td><td>${esc(t.desc)}</td><td>${(t.amt < 0 ? '−' : '') + numF(2, 2).format(Math.abs(t.amt))}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No transactions this month</td></tr>'}</tbody></table>`), 'text/html');
}

function openTx(id){
  const t = state.txns.find(x => x.id === id); if (!t) return;

  openModal({title:'Transaction', render(m){
    m.body.innerHTML = `<div class="tx-head">${catIcon(t.cat)}<div><p class="big-amt" style="margin:0 0 2px">${money(t.amt, t.cur, {sign:true, force:true})}</p><p class="sub" style="margin:0">${esc(t.desc)}</p></div></div>

      <div class="field"><label for="tx-cat">Category</label><select class="input" id="tx-cat">${Object.entries(CATS).map(([k, c]) => `<option value="${k}" ${k === t.cat ? 'selected' : ''}>${c.n}</option>`).join('')}</select></div>
      <div class="field"><label for="tx-note">Note</label><input class="input" id="tx-note" maxlength="80" value="${esc(t.note || '')}" placeholder="Add a private note"></div>
      <div class="actions" style="flex-wrap:wrap"><button class="btn small" id="tx-rc">${I.download} Receipt</button>${card && !card.frozen ? `<button class="btn small" id="tx-fr">${I.snow} Freeze card</button>` : ''}${t.amt < 0 && ['card','payment','bill'].includes(t.type) ? `<button class="btn small" id="tx-dp">${I.flag} Report a problem</button>` : ''}<button class="btn small primary" id="tx-save">Save</button></div>`;
    $('#tx-save').onclick = () => { t.cat = $('#tx-cat').value; t.note = $('#tx-note').value.trim(); closeModal(); render(); toast('Transaction updated'); };
    $('#tx-rc').onclick = () => download(`grat-receipt-${t.ref}.txt`, `Grat receipt\n\n${t.desc}\n${fmtWhen(t.ts)}\nAmount: ${t.amt < 0 ? '-' : ''}${CURS[t.cur].sym}${Math.abs(t.amt).toFixed(2)}\nAccount: ${a.name}\nID: ${t.ref}\n\nPrototype document.`);
    $('#tx-fr') && ($('#tx-fr').onclick = () => { card.frozen = true; closeModal(); render(); toast(`${card.name} frozen`); });
    $('#tx-dp') && ($('#tx-dp').onclick = () => openDispute(t));
  }});
}
function openDispute(t){
  const w = {reason:'', details:'', step:1, errors:{}};
  openModal({title:'Report a problem', render(m){
    const draw = () => {
      if (w.step === 1){
        m.body.innerHTML = `<p class="hint">${esc(t.desc)}, ${money(t.amt, t.cur, {force:true})} on ${dateFmt.day.format(t.ts)}</p><form id="dsf" novalidate>
          <fieldset class="choices" style="grid-template-columns:1fr"><legend>What’s wrong?</legend>${[['fraud', 'I didn’t make this payment'], ['twice', 'I was charged twice'], ['amount', 'The amount is wrong'], ['goods', 'I didn’t get what I paid for']].map(([v, l]) => `<label class="choice"><input type="radio" name="dsr" value="${v}" ${w.reason === v ? 'checked' : ''}><span style="text-align:left;padding:10px 12px">${l}</span></label>`).join('')}</fieldset>${E(w, 'reason')}
          <div class="field"><label for="ds-d">Tell us more</label><textarea class="input" id="ds-d" rows="3" maxlength="500" ${inv(w, 'details')}>${esc(w.details)}</textarea>${E(w, 'details')}</div>
          <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Submit</button></div></form>`;
        $('#dsf').onsubmit = e => { e.preventDefault(); const r = $('input[name=dsr]:checked', m.body); w.reason = r ? r.value : ''; w.details = $('#ds-d').value.trim(); w.errors = {};
          if (!w.reason) w.errors.reason = 'Choose what’s wrong.';
          if (w.details.length < 10) w.errors.details = 'Please give us a few more details (at least 10 characters).';
          if (Object.keys(w.errors).length){ draw(); (w.errors.reason ? $('input[name=dsr]', m.body) : $('#ds-d')).focus(); return; }
          const cs = 'CS-' + Math.floor(100000 + Math.random() * 899999); state.disputes.push({id:cs, tx:t.id, reason:w.reason, ts:Date.now()});
          const card = state.cards.find(c => c.acct === t.acct);
          m.setTitle('We’re on it');
          m.body.innerHTML = doneBlock({pending:true, big:cs, sub:`We’ll review this within 10 working days and keep you updated by email.${w.reason === 'fraud' ? ' We’ve also frozen the card so no more payments go through.' : ''}`}) + `<div class="actions split"><button class="btn primary" data-close data-autofocus>Done</button></div>`;
          if (w.reason === 'fraud' && card) card.frozen = true; render(); m.focusFirst(); };
      }
    };
    draw();
  }});
}

/* ================= Hash routing ================= */
let suppressHash = null;
function setHash(h){ if (location.hash !== h){ suppressHash = h; location.hash = h; } }
function syncHash(){ setHash(state.route.view === 'account' ? `#/account/${state.route.arg}` : `#/${state.route.view}`); }
addEventListener('hashchange', () => { if (location.hash === suppressHash){ suppressHash = null; return; } suppressHash = null; handleRoute(); });
function handleRoute(){
  if (state.demo.maint){ showSpecial('maint'); return; }
  hideSpecial();
  const [p0, p1] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (!p0 || p0 === 'welcome'){ state.signedIn ? showApp('home') : showLanding(); return; }
  if (p0 === 'login' || p0 === 'signup'){ state.signedIn ? showApp('home') : showLogin(p0 === 'signup' ? 'signup' : 'signin'); return; }
  if (INFO[p0]){ showInfo(p0); return; }
  const ok = p0 === 'account' ? !!ACC(p1 || '') : !!VIEWS[p0];
  if (!ok){ show404(); return; }
  const arg = p0 === 'account' ? p1 : undefined;
  if (!state.signedIn){ state.afterLogin = {view:p0, arg}; showLogin('signin'); toast('Sign in to continue'); return; }
  showApp(p0, arg, true);
}
function showScreen(which){
  $('#landing').hidden = which !== 'landing'; $('#login').hidden = which !== 'login'; $('#app').hidden = which !== 'app';
  document.body.classList.toggle('signed-out', which !== 'app');
  if (which === 'app') $('.cookie')?.remove();
  hideSpecial();
}
function showLanding(){
  renderLanding(); showScreen('landing');
  if (!['', '#', '#/', '#/welcome'].includes(location.hash)) setHash('#/');
  window.scrollTo(0, 0); updateLive();
  if (!state.cookie) showCookieBanner();
}
function showLogin(step = 'signin'){
  showScreen('login'); renderLogin(step);
  setHash(step === 'signup' ? '#/signup' : '#/login');
  window.scrollTo(0, 0); updateLive();
  if (!state.cookie) showCookieBanner();
}
function showApp(view = 'home', arg, fromHash){ showScreen('app'); setView(view, arg, {fromHash}); }

function showCookieBanner(){

  c.innerHTML = `<h2 id="ck-h">Cookies on Grat</h2><p>We use necessary cookies to keep you signed in and safe. With your OK, we’d also use analytics cookies to improve the site.</p>
    <div class="actions"><button class="btn small primary" data-ck="all">Accept all</button><button class="btn small" data-ck="none">Necessary only</button><button class="btn small" data-ck="manage">Choose</button></div>`;

    const b = e.target.closest('[data-ck]'); if (!b) return;

    state.cookie = {analytics: b.dataset.ck === 'all', marketing: b.dataset.ck === 'all'};
