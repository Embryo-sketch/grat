    .landing-mode .landing-view{background:var(--ice)}
    .landing-mode .lp-hero{background:#060b16;color:#fff}
    .landing-mode .lp-hero .lp-hero-in{max-width:1180px}
    .landing-mode .lp-head{position:fixed}
    .login{min-height:100vh;display:grid;grid-template-columns:1.1fr minmax(380px,1fr);background:#060b16}
    .login-art{position:relative;padding:36px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:100vh}
    .login-art h1{font-size:clamp(36px,4.6vw,64px);font-weight:300;letter-spacing:-.045em;line-height:1;margin:0;max-width:12ch;color:#fff}
    .login-art .lead{color:#a9b8ce;max-width:42ch;margin:16px 0 22px;font-size:16px}
    .login-form{position:relative;display:flex;align-items:center;justify-content:center;padding:32px 24px;background:#060b16}
    .glass{width:min(450px,100%);padding:30px 28px;border-radius:26px;background:rgba(15,23,40,.82);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.45);color:#e7edf6}
    .glass .field label{color:#dbe4f2}.glass .field input{background:rgba(8,13,24,.7);border-color:#34435b;color:#fff}
    .glass .sub,.glass .helper{color:#a9b8ce}
    @media(max-width:900px){#main{padding:16px 22px 45px}.login{grid-template-columns:1fr}.login-art{min-height:400px}.login-form{min-height:500px}}
    @media(max-width:680px){#main{padding:12px 16px 94px}.app-shell .quick{grid-template-columns:repeat(2,minmax(0,1fr))}.app-shell .grid{grid-template-columns:1fr}.app-shell .hero{display:block;padding:20px}.app-shell .overview-metrics{margin-top:18px}.app-shell .overview-count{min-width:0;padding-left:15px}.login-art{padding:26px 24px;min-height:360px}.login-form{padding:18px 16px;min-height:auto}}</style>
</head>
<body>
  <div id="appShell" class="app-shell shell auth-mode">
    <aside class="side-panel side" aria-label="Main navigation">
      <div class="brand"><i class="brand-mark" aria-hidden="true"></i>Grat</div>
      <button id="sideAction" class="side-action trade-btn" type="button">New request</button>
      <nav class="side-nav"><button id="navHome" class="nav-btn" type="button" aria-current="page"><span class="nav-symbol">⌂</span>Home</button><button id="navAccounts" class="nav-btn" type="button"><span class="nav-symbol">▣</span>Accounts</button><button id="navRequests" class="nav-btn" type="button"><span class="nav-symbol">⇄</span>Requests</button><button id="navProfile" class="nav-btn" type="button"><span class="nav-symbol">♙</span>Profile</button></nav>
      <div class="side-foot"><div class="side-status"><strong>Manual review</strong>Requests are reviewed by Grat staff. No funds move through this app.</div></div>
    </aside>
    <div id="main" class="main-column">
      <header class="app-top top"><h1 id="pageHeading">Customer access</h1><div class="top-actions"><span id="topEmail"></span><button id="signOut" class="button ghost hidden" type="button">Sign out</button></div></header>
      <main id="root" class="page"></main>
    </div>
  </div>
  <footer class="footer">Grat records customer requests for manual review. It is not a bank. No funds are held, transferred, or paid by this portal.</footer>
  <script type="module">
    const root=document.querySelector('#root');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);
    const date=s=>s?new Date(s).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'}):'';
    const key='grat.auth.session'; let cfg,session,me;
    function readSession(){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
    function saveSession(s){session=s;if(s)localStorage.setItem(key,JSON.stringify(s));else localStorage.removeItem(key)}
    async function loadConfig(){const r=await fetch('/api/config');if(!r.ok)throw Error('Grat could not load its service configuration.');cfg=await r.json()}
    async function auth(path,body){const r=await fetch(cfg.supabaseUrl+'/auth/v1/'+path,{method:'POST',headers:{'content-type':'application/json',apikey:cfg.publishableKey},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Authentication could not be completed.');return d}
    async function api(path,options={}){const r=await fetch(path,{...options,headers:{...(options.body?{'content-type':'application/json'}:{}),authorization:'Bearer '+session.access_token,...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'The request could not be completed.');return d}
    async function currentUser(){session=readSession();if(!session?.access_token)return null;try{const r=await fetch('/api/me',{headers:{authorization:'Bearer '+session.access_token}});if(r.status===401&&session.refresh_token){const d=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});saveSession(d);return currentUser()}if(!r.ok){saveSession(null);return null}return await r.json()}catch{saveSession(null);return null}}
    function alertBox(text,type='error'){const el=document.querySelector('#alert');if(el){el.textContent=text;el.className='alert show '+type}}
    function renderLanding(){document.querySelector('#appShell').classList.remove('auth-mode');document.querySelector('#appShell').classList.add('landing-mode');document.querySelector('#pageHeading').textContent='Welcome to Grat';document.querySelector('#topEmail').textContent='';document.querySelector('#signOut').classList.add('hidden');root.innerHTML=`<div class="landing-view"><header class="lp-head"><div class="brand"><i class="brand-mark" aria-hidden="true"></i>Grat</div><nav><a href="#how-it-works">How it works</a><a href="#what-you-can-do">What you can do</a><button class="button ghost" id="landingSignIn">Sign in</button><button class="button" id="landingSignup">Create profile</button></nav></header><section class="lp-hero"><div class="landing-grid" aria-hidden="true"></div><div class="lp-hero-in"><div class="lp-copy"><div class="eyebrow">A clear customer request portal</div><h1>Money requests,<br><span>handled clearly.</span></h1><p>Create your profile, submit transfer requests and follow each review in one place. Grat staff handle approved requests manually outside the app.</p><div class="lp-actions"><button class="button" id="heroSignup">Create your profile</button><button class="button ghost" id="heroSignIn">Sign in</button></div><div class="lp-trust"><span>◈ Private customer profiles</span><span>✓ Status updates</span><span>↗ Manual review</span></div></div><aside class="lp-preview" aria-label="Grat request workflow"><div class="preview-head"><span>YOUR REQUEST CENTER</span><span>Grat</span></div><div class="preview-symbol" aria-hidden="true">⇄</div><h2>Everything in one clear view</h2><p>Submit a request securely, see its status and read updates from the Grat team.</p><div class="preview-row"><span>Request submitted</span><strong>Recorded</strong></div><div class="preview-row"><span>Staff review</span><strong>Manual</strong></div><div class="preview-row"><span>External payout</span><strong>Confirmed by staff</strong></div></aside></div></section><section id="how-it-works" class="lp-content"><div class="eyebrow">How Grat works</div><h2>One simple process, from request to update.</h2><p>Grat keeps the request details and review status together. It does not connect to a US bank, hold money, verify balances or execute a transaction.</p><div id="what-you-can-do" class="lp-cards"><article class="lp-card"><span class="step">01</span><h3>Create a profile</h3><p>Register with your email and access your private Grat profile.</p></article><article class="lp-card"><span class="step">02</span><h3>Submit a request</h3><p>Provide transfer details for Grat staff to review. Submission does not move money.</p></article><article class="lp-card"><span class="step">03</span><h3>Follow the review</h3><p>Check the request status and any notes added by staff. Payouts happen outside the app.</p></article></div></section></div>`;for(const id of ['landingSignIn','heroSignIn'])document.querySelector('#'+id).onclick=()=>authScreen('signin');for(const id of ['landingSignup','heroSignup'])document.querySelector('#'+id).onclick=()=>authScreen('signup')}
    function authScreen(mode='signin'){const signup=mode==='signup';document.querySelector('#appShell').classList.remove('landing-mode');document.querySelector('#appShell').classList.add('auth-mode');document.querySelector('#pageHeading').textContent='Customer access';document.querySelector('#navRequests').setAttribute('aria-current','page');root.className='page';root.innerHTML=`<section class="login"><div class="login-art space"><div class="aurora" aria-hidden="true"></div><div class="grid-floor" aria-hidden="true"></div><div style="display:flex;justify-content:space-between;align-items:center"><div class="brand"><i class="brand-mark" aria-hidden="true"></i>Grat</div><button class="back-link" id="backHome" type="button">← Home</button></div><div><div class="eyebrow" style="color:#8fe3f5">CUSTOMER ACCESS</div><h1>${signup?'Your profile, <span class="grad">kept simple.</span>':'Your requests, <span class="grad">clear and calm.</span>'}</h1><p class="lead">${signup?'Create a profile to submit and follow transfer requests.':'Sign in to view your profile, recorded balance and request history.'}</p></div><div class="secure-row"><span>◈ Private profile</span><span>✓ Staff review</span><span>⇄ Request updates</span></div></div><div class="login-form"><div class="glass"><h2>${signup?'Create your profile':'Sign in'}</h2><p class="sub">${signup?'Set up your Grat customer profile.':'Welcome back to Grat.'}</p><div id="alert" class="alert"></div><form id="authForm">${signup?'<div class="field"><label for="name">Full name</label><input class="input" id="name" name="name" autocomplete="name" required maxlength="100"></div>':''}<div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" minlength="8" required></div><button class="button block" type="submit">${signup?'Create profile':'Continue'}</button></form>${signup?'':`<div class="divider">or</div><button class="btn block" type="button" disabled aria-disabled="true">Passkey sign-in will be added later</button>`}<p class="auth-switch">${signup?'Already registered?':'New to Grat?'} <button class="link" id="switchAuth" type="button">${signup?'Sign in':'Create an account'}</button></p><p class="helper">Grat records requests for staff review. It does not hold or move funds.</p><div class="secure-row"><span>◈ Secure connection</span><span>✓ Supabase Auth</span></div></div></div></section>`;
      document.querySelector('#backHome').onclick=()=>renderLanding();document.querySelector('#switchAuth').onclick=()=>authScreen(signup?'signin':'signup');document.querySelector('#authForm').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#authForm button[type=submit]');b.disabled=true;try{const fd=new FormData(e.currentTarget),email=fd.get('email').trim(),password=fd.get('password');if(signup){const d=await auth('signup',{email,password,data:{full_name:fd.get('name').trim()}});if(d.access_token){saveSession(d);await render()}else alertBox('Check your email for a confirmation link, then return here to sign in.','success')}else{saveSession(await auth('token?grant_type=password',{email,password}));await render()}}catch(err){alertBox(err.message)}finally{b.disabled=false}}}
    function statusName(s){return ({submitted:'Submitted',under_review:'Under review',needs_info:'More information needed',approved:'Approved for manual payout',sent:'Payout recorded',rejected:'Declined'})[s]||s}
    function requestCard(r,staff){return `<article class="request"><div class="request-head"><div><div class="request-title">${esc(r.recipient)} · ${esc(r.bank)}</div><div class="request-meta">${staff?`${esc(r.customer.name||'Customer')} · ${esc(r.customer.email)} · `:''}${date(r.createdAt)}</div></div><div class="amount">${money(r.amountCents)}</div></div><span class="badge ${esc(r.status)}">${esc(statusName(r.status))}</span><div class="request-meta">From ${esc(r.fromAccount)} · account ending ${esc(r.accountLast4)}</div>${r.memo?`<div class="request-note">${esc(r.memo)}</div>`:''}${r.staffNote?`<div class="request-note"><strong>Staff update:</strong> ${esc(r.staffNote)}</div>`:''}${r.payout?`<div class="request-note"><strong>Recorded payout:</strong> ${money(r.payout.amountCents)} via ${esc(r.payout.provider)} · reference ${esc(r.payout.reference)} · ${date(r.payout.sentAt)}. This records an action completed outside Grat.</div>`:''}<div class="history">Request ID: ${esc(r.id)}</div>${staff&&!['sent','rejected'].includes(r.status)?`<details class="request-admin"><summary>Review request</summary><form data-review="${esc(r.id)}"><div class="field"><label>Status</label><select name="status">${nextStatuses(r.status).map(s=>`<option value="${s}">${statusName(s)}</option>`).join('')}</select></div><div class="field"><label>Note for customer</label><textarea name="note" maxlength="240" placeholder="Optional update or information needed"></textarea></div><div class="admin-grid ${r.status==='approved'?'':'hidden'}" data-payout><div class="field"><label>Manual payout provider</label><input name="provider" maxlength="80" placeholder="e.g. External provider"></div><div class="field"><label>External reference</label><input name="reference" maxlength="160" placeholder="Confirmation reference"></div><div class="field"><label>Amount sent (USD)</label><input name="payoutAmount" type="number" min="0.01" step="0.01" value="${(r.amountCents/100).toFixed(2)}"></div></div><div class="form-actions"><button class="button secondary" type="submit">Save review</button></div><p class="helper">Mark “Payout recorded” only after you personally complete and confirm the external payout.</p></form></details>`:''}</article>`}
    function nextStatuses(s){return ({submitted:['under_review','rejected'],under_review:['needs_info','approved','rejected'],needs_info:['under_review','rejected'],approved:['sent']})[s]||[]}
    async function dashboard(){me=await currentUser();if(!me){document.querySelector('#topEmail').textContent='';document.querySelector('#signOut').classList.add('hidden');renderLanding();return}document.querySelector('#appShell').classList.remove('auth-mode','landing-mode');document.querySelector('#topEmail').textContent=me.email||'';document.querySelector('#signOut').classList.remove('hidden');const staff=['staff','admin'].includes(me.role);document.querySelector('#pageHeading').textContent=`${staff?'Grat operations':'Good '+(new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening')+', '+(me.fullName||'')}`;document.querySelector('#sideAction').textContent=staff?'Review requests':'New request';document.querySelector('#navHome').setAttribute('aria-current','page');document.querySelector('#navRequests').removeAttribute('aria-current');document.querySelector('#navProfile').removeAttribute('aria-current');root.innerHTML=`<section class="hero"><div><div class="eyebrow">${staff?'Operations workspace':'Customer portal'}</div><h1>${staff?'Request overview':'Your Grat overview'}</h1><p>${staff?'Review customer requests and record updates. Any payout is performed independently outside Grat.':'Submit and follow transfer requests for manual review.'}</p></div><div class="overview-count"><span>Open requests</span><strong id="openCount">—</strong><small>Awaiting final status</small></div></section><div class="quick" role="group" aria-label="Quick actions"><button class="qa primary" id="quickNew"><span class="ic">⇄</span>New request</button><button class="qa" id="quickRequests"><span class="ic">▤</span>View requests</button><button class="qa" id="quickProfile"><span class="ic">♙</span>Profile</button></div><div class="notice"><strong>Manual request service.</strong> Grat does not connect to US banks, hold funds, verify balances, or execute payments. A request is not a completed transfer. ${staff?'Record external payout details only after you have confirmed the payout yourself.':'Only submit requests you are authorized to make. Never include passwords, full card numbers, or online banking credentials.'}</div><div class="grid" style="margin-top:20px"><section class="card" id="requestPanel"><div class="section-head"><h2>${staff?'All transfer requests':'Your transfer requests'}</h2><select id="statusFilter" class="filter"><option value="all">All statuses</option><option value="submitted">Submitted</option><option value="under_review">Under review</option><option value="needs_info">Needs information</option><option value="approved">Approved</option><option value="sent">Payout recorded</option><option value="rejected">Declined</option></select></div><div id="alert" class="alert"></div><div id="requests" class="request-list"><div class="empty">Loading requests…</div></div></section>${staff?`<aside class="card"><h2>Staff access</h2><p class="sub">Signed in as ${esc(me.role)}. Request visibility and updates are restricted by your Grat staff role.</p><div class="notice">Approve a request only for manual processing. The customer’s requested amount is not verified by the app.</div></aside>`:`<section class="card" id="requestFormPanel"><h2>New transfer request</h2><p class="sub">Send a request for review. No money will move when you submit this form.</p><form id="newRequest"><div class="field"><label>From account or wallet label</label><input name="fromAccount" required maxlength="80" placeholder="Personal checking, wallet, etc."></div><div class="two"><div class="field"><label>Recipient name</label><input name="recipient" required maxlength="100"></div><div class="field"><label>Recipient bank</label><input name="bank" required maxlength="100"></div></div><div class="two"><div class="field"><label>Recipient account last 4 digits</label><input name="accountLast4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></div><div class="field"><label>Requested amount (USD)</label><input name="amount" type="number" min="0.01" max="1000000" step="0.01" required></div></div><div class="field"><label>Note (optional)</label><textarea name="memo" maxlength="120" placeholder="Purpose or details for the reviewer"></textarea></div><div class="form-actions"><button class="button" type="submit">Submit for review</button></div></form></section>`}</div>`;
      const firstMetric=document.querySelector('.overview-count');firstMetric.outerHTML=staff?'<div class="overview-metrics"><div class="overview-count"><span>Customer profiles</span><strong id="customerCount">—</strong><small>Accounts in Grat</small></div><div class="overview-count"><span>Open requests</span><strong id="openCount">—</strong><small>Awaiting final status</small></div></div>':'<div class="overview-metrics"><div class="overview-count"><span>Recorded balance</span><strong id="balanceAmount">—</strong><small id="balanceNote">From staff-posted ledger entries</small></div><div class="overview-count"><span>Open requests</span><strong id="openCount">—</strong><small>Awaiting final status</small></div></div>';
      async function showAccounts(){document.querySelector('#navHome').removeAttribute('aria-current');document.querySelector('#navRequests').removeAttribute('aria-current');document.querySelector('#navProfile').removeAttribute('aria-current');document.querySelector('#navAccounts').setAttribute('aria-current','page');document.querySelector('#pageHeading').textContent=staff?'Customer accounts':'Accounts';if(staff){root.innerHTML=`<section class="hero"><div><div class="eyebrow">Account management</div><h1>Customer balances</h1><p>Balances are calculated from immutable ledger entries recorded by staff.</p></div></section><div class="notice"><strong>Post confirmed entries only.</strong> Add a credit only after funds are confirmed received; add a debit only after the external payout is confirmed. Debits cannot exceed the recorded balance. Entries cannot be edited or deleted.</div><section class="card" style="margin-top:18px"><div class="section-head"><h2>Customer accounts</h2><span class="helper">USD · manual ledger</span></div><div id="accountsAlert" class="alert"></div><div id="customerAccounts"><div class="empty">Loading accounts…</div></div></section>`;try{const accounts=await api('/api/admin/accounts');document.querySelector('#customerAccounts').innerHTML=accounts.length?accounts.map(a=>`<article class="customer-account"><div class="customer-account-head"><div><strong>${esc(a.fullName||'Customer')}</strong><div class="request-meta">${esc(a.email||'')} · ${Number(a.entryCount)} ledger entries${a.lastEntryAt?' · updated '+date(a.lastEntryAt):''}</div></div><strong>${money(a.balanceCents)}</strong></div><details><summary>Record a confirmed credit or debit</summary><form data-ledger-customer="${esc(a.customerId)}"><div class="two"><div class="field"><label>Entry type</label><select name="type" class="filter" required><option value="credit">Credit</option><option value="debit">Debit</option></select></div><div class="field"><label>Amount (USD)</label><input name="amount" type="number" min="0.01" step="0.01" required></div></div><div class="field"><label>Description</label><input name="description" maxlength="160" required placeholder="Confirmed deposit, manual payout, adjustment"></div><div class="field"><label>External reference (optional)</label><input name="reference" maxlength="160" placeholder="Confirmation or transaction reference"></div><button class="button secondary" type="submit">Post ledger entry</button></form></details></article>`).join(''):'<div class="empty">No customer profiles found.</div>';document.querySelectorAll('[data-ledger-customer]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;const fd=new FormData(form);try{await api('/api/account-ledger',{method:'POST',body:JSON.stringify({customerId:form.dataset.ledgerCustomer,type:fd.get('type'),amountCents:Math.round(Number(fd.get('amount'))*100),description:fd.get('description'),externalReference:fd.get('reference')})});await showAccounts()}catch(err){const box=document.querySelector('#accountsAlert');box.textContent=err.message;box.className='alert show error';button.disabled=false}})}catch(err){const box=document.querySelector('#accountsAlert');box.textContent=err.message;box.className='alert show error'}}else{root.innerHTML=`<section class="hero"><div><div class="eyebrow">Your account</div><h1>Balance and ledger</h1><p>Your balance reflects credits and debits recorded by Grat staff.</p></div><div class="overview-count" style="border:0"><span>Recorded balance</span><strong id="accountBalance">—</strong><small id="accountBalanceNote">USD</small></div></section><div class="grid"><section class="card"><div class="section-head"><h2>Ledger activity</h2><span class="helper">Most recent 100 entries</span></div><div id="ledgerEntries"><div class="empty">Loading account history…</div></div></section><aside class="card"><h2>About your balance</h2><p class="sub">This is the sum of ledger entries recorded by Grat staff. A request or approval does not change this amount.</p><div class="notice">Grat does not hold funds or connect to a bank. Contact support if an entry looks incorrect.</div></aside></div>`;try{const data=await api('/api/account-ledger');document.querySelector('#accountBalance').textContent=money(data.balanceCents);document.querySelector('#accountBalanceNote').textContent=`${Number(data.entryCount)} posted ledger entries`;document.querySelector('#ledgerEntries').innerHTML=data.entries.length?data.entries.map(e=>`<div class="ledger-entry"><div><div class="entry-title">${esc(e.description)}</div><div class="entry-meta">${date(e.createdAt)}${e.externalReference?' · Ref '+esc(e.externalReference):''}</div></div><strong class="${esc(e.type)}">${e.type==='credit'?'+':'−'}${money(e.amountCents)}</strong></div>`).join(''):'<div class="empty">No ledger entries have been posted. Your recorded balance is $0.00.</div>'}catch(err){document.querySelector('#accountBalance').textContent='Unavailable';document.querySelector('#accountBalanceNote').textContent='Ledger setup required';const box=document.querySelector('#ledgerEntries');box.innerHTML=`<div class="alert show error">${esc(err.message)}</div>`}}}
      document.querySelector('#navHome').onclick=()=>dashboard();document.querySelector('#navAccounts').onclick=showAccounts;document.querySelector('#navRequests').onclick=()=>{document.querySelector('#navHome').removeAttribute('aria-current');document.querySelector('#navAccounts').removeAttribute('aria-current');document.querySelector('#navProfile').removeAttribute('aria-current');document.querySelector('#navRequests').setAttribute('aria-current','page');document.querySelector('#pageHeading').textContent='Transfer requests';document.querySelector('#requestPanel').scrollIntoView({behavior:'smooth',block:'start'})};document.querySelector('#navProfile').onclick=()=>{document.querySelector('#navHome').removeAttribute('aria-current');document.querySelector('#navAccounts').removeAttribute('aria-current');document.querySelector('#navRequests').removeAttribute('aria-current');document.querySelector('#navProfile').setAttribute('aria-current','page');document.querySelector('#pageHeading').textContent='Your profile';root.innerHTML=`<section class="hero"><div><div class="eyebrow">Account</div><h1>Profile details</h1><p>Your Grat login and access information.</p></div></section><div class="grid"><section class="card"><h2>Personal details</h2><div class="account-row"><span>Full name</span><strong>${esc(me.fullName||'Not provided')}</strong></div><div class="account-row"><span>Email</span><strong>${esc(me.email||'')}</strong></div></section><aside class="card"><h2>Access</h2><div class="account-row"><span>Profile type</span><strong>${esc(me.role)}</strong></div><p class="helper">Profile permissions are managed by Grat staff. Contact support if your access needs to change.</p></aside></div>`};document.querySelector('#sideAction').onclick=()=>{const form=document.querySelector('#newRequest');if(form){form.scrollIntoView({behavior:'smooth',block:'start'});form.elements.fromAccount.focus()}else{const requests=document.querySelector('#requests');if(requests)requests.scrollIntoView({behavior:'smooth',block:'start'});else document.querySelector('#navHome').click()}};document.querySelector('#quickNew').onclick=()=>document.querySelector('#sideAction').click();document.querySelector('#quickRequests').onclick=()=>document.querySelector('#navRequests').click();document.querySelector('#quickProfile').onclick=()=>document.querySelector('#navProfile').click();
      document.querySelector('#signOut').onclick=async()=>{try{await fetch(cfg.supabaseUrl+'/auth/v1/logout',{method:'POST',headers:{apikey:cfg.publishableKey,authorization:'Bearer '+session.access_token}})}catch{}saveSession(null);await render()};
      let rows=[];try{rows=await api('/api/transfer-requests')}catch(e){alertBox(e.message)}document.querySelector('#openCount').textContent=rows.filter(r=>!['sent','rejected'].includes(r.status)).length;if(staff){try{const customerAccounts=await api('/api/admin/accounts');document.querySelector('#customerCount').textContent=customerAccounts.length}catch{document.querySelector('#customerCount').textContent='—'}}else{try{const ledger=await api('/api/account-ledger');document.querySelector('#balanceAmount').textContent=money(ledger.balanceCents);document.querySelector('#balanceNote').textContent=ledger.entryCount?`${Number(ledger.entryCount)} staff-posted ledger entries`:'No ledger entries posted yet'}catch{document.querySelector('#balanceAmount').textContent='Unavailable';document.querySelector('#balanceNote').textContent='Ledger setup required'}}const list=document.querySelector('#requests');const draw=()=>{const f=document.querySelector('#statusFilter').value,items=rows.filter(x=>f==='all'||x.status===f);list.innerHTML=items.length?items.map(r=>requestCard(r,staff)).join(''):'<div class="empty">No requests to show yet.</div>';if(staff)document.querySelectorAll('[data-review]').forEach(form=>{const sel=form.elements.status,payout=form.querySelector('[data-payout]');const update=()=>payout.classList.toggle('hidden',sel.value!=='sent');sel.addEventListener('change',update);update();form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;const id=form.dataset.review,status=sel.value,payload={status,note:form.elements.note.value};if(status==='sent'){payload.externalProvider=form.elements.provider.value;payload.externalReference=form.elements.reference.value;payload.payoutAmountCents=Math.round(Number(form.elements.payoutAmount.value)*100)}try{const updated=await api('/api/transfer-requests/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(payload)});rows=rows.map(x=>x.id===id?updated:x);document.querySelector('#openCount').textContent=rows.filter(r=>!['sent','rejected'].includes(r.status)).length;alertBox('Request updated.','success');draw()}catch(err){alertBox(err.message);b.disabled=false}}})};document.querySelector('#statusFilter').onchange=draw;draw();
      if(!staff){document.querySelector('#newRequest').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,b=form.querySelector('button');b.disabled=true;const fd=new FormData(form);try{const r=await api('/api/transfer-requests',{method:'POST',body:JSON.stringify({fromAccount:fd.get('fromAccount'),recipient:fd.get('recipient'),bank:fd.get('bank'),accountLast4:fd.get('accountLast4'),amountCents:Math.round(Number(fd.get('amount'))*100),memo:fd.get('memo')})});rows.unshift(r);form.reset();alertBox('Your request was saved for manual review. No funds were moved.','success');draw()}catch(err){alertBox(err.message);b.disabled=false}}}
    }
    async function render(){document.querySelector('#signOut').classList.add('hidden');try{if(!cfg)await loadConfig();const saved=readSession();if(!saved?.access_token){if(location.hash==='#/login'||location.hash==='#/signup')authScreen(location.hash==='#/signup'?'signup':'signin');else renderLanding();return}await dashboard()}catch(e){document.querySelector('#appShell').classList.remove('landing-mode');document.querySelector('#appShell').classList.add('auth-mode');root.innerHTML=`<section class="auth-wrap"><div class="card"><h1 class="auth-title">Grat is unavailable</h1><p class="sub">${esc(e.message)}</p><button class="button" onclick="location.reload()">Try again</button></div></section>`}}
    render();
  </script>
</body>
</html>
